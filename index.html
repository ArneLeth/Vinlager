<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vinlager">

<title>Mit Vinlager</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f5f2;
    color: #222;
}

.app {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin: 7px 0;
    font-size: 17px;
    font-weight: 600;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.scan {
    font-size: 20px;
    padding: 22px;
    background: #222;
    color: white;
}

.category {
    text-align: left;
    font-weight: 500;
}

.count {
    float: right;
    color: #888;
}

#scanner {
    display: none;
    margin-top: 20px;
    background: white;
    border-radius: 16px;
    padding: 10px;
    overflow: hidden;
}

.scanner-controls {
    display: none;
}

#result {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 14px;
    text-align: center;
}

.barcode {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}

.form {
    display: none;
    margin-top: 20px;
}

.form input,
.form select,
.form textarea {
    width: 100%;
    padding: 14px;
    margin: 6px 0 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.form label {
    font-weight: 600;
}

.save {
    background: #222;
    color: white;
}

.back {
    background: #ddd;
}
</style>
</head>

<body>

<div class="app">

    <h1>🍷 Mit Vinlager</h1>

    <div class="subtitle">
        Dit private vinlager
    </div>

    <div id="mainMenu">

        <button class="scan" onclick="startScanner()">
            📷 Scan vin
        </button>

        <button onclick="showAddForm()">
            ➕ Tilføj vin
        </button>

        <button>
            🔎 Søg i vinlager
        </button>

        <br>

        <button class="category">
            🍷 Rødvin
            <span class="count">0</span>
        </button>

        <button class="category">
            🥂 Hvidvin
            <span class="count">0</span>
        </button>

        <button class="category">
            🫧 Mousserende
            <span class="count">0</span>
        </button>

        <button class="category">
            🍾 Champagne
            <span class="count">0</span>
        </button>

        <button class="category">
            🍷 Portvin
            <span class="count">0</span>
        </button>

        <button class="category">
            🥃 Spiritus
            <span class="count">0</span>
        </button>

    </div>


    <!-- SCANNER -->

    <div id="scanner"></div>

    <div class="scanner-controls" id="scannerControls">

        <button onclick="stopScanner()" class="back">
            ← Luk scanner
        </button>

    </div>


    <!-- RESULTAT -->

    <div id="result">

        <div>Stregkode fundet</div>

        <div class="barcode" id="barcode"></div>

        <button onclick="addScannedWine()">
            ➕ Tilføj denne vin
        </button>

    </div>


    <!-- TILFØJ VIN -->

    <div class="form" id="addForm">

        <h2>➕ Tilføj vin</h2>

        <label>Stregkode</label>
        <input id="wineBarcode" type="text" inputmode="numeric">

        <label>Navn</label>
        <input id="wineName" type="text" placeholder="Vinens navn">

        <label>Producent</label>
        <input id="wineProducer" type="text" placeholder="Producent">

        <label>Årgang</label>
        <input id="wineYear" type="number" placeholder="Fx 2020">

        <label>Type</label>
        <select id="wineType">
            <option value="Rødvin">🍷 Rødvin</option>
            <option value="Hvidvin">🥂 Hvidvin</option>
            <option value="Mousserende">🫧 Mousserende</option>
            <option value="Champagne">🍾 Champagne</option>
            <option value="Portvin">🍷 Portvin</option>
            <option value="Spiritus">🥃 Spiritus</option>
        </select>

        <label>Land</label>
        <input id="wineCountry" type="text" placeholder="Fx Italien">

        <label>Antal</label>
        <input id="wineQuantity" type="number" value="1" min="1">

        <label>Placering</label>
        <input id="wineLocation" type="text" placeholder="Fx Reol 2, hylde 3">

        <label>Noter</label>
        <textarea id="wineNotes" rows="4"
            placeholder="Dine egne noter"></textarea>

        <button class="save" onclick="saveWine()">
            💾 Gem vin
        </button>

        <button class="back" onclick="showMain()">
            ← Tilbage
        </button>

    </div>

</div>


<script>

let scanner = null;


/* =========================
   SCANNER
========================= */

function startScanner() {

    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("scanner").style.display = "block";
    document.getElementById("scannerControls").style.display = "block";
    document.getElementById("result").style.display = "none";

    scanner = new Html5Qrcode("scanner");

    const config = {

        fps: 15,

        qrbox: {
            width: 320,
            height: 160
        },

        aspectRatio: 1.7777778,

        formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E
        ]

    };


    scanner.start(

        {
            facingMode: {
                exact: "environment"
            }
        },

        config,

        function(decodedText) {

            document.getElementById("barcode").textContent =
                decodedText;

            document.getElementById("result").style.display =
                "block";

            scanner.stop().then(function() {

                document.getElementById("scanner").style.display =
                    "none";

                document.getElementById("scannerControls").style.display =
                    "none";

            });

        },

        function(errorMessage) {

            // Scanner leder hele tiden.
            // Derfor viser vi ikke fejlbeskeder.

        }

    ).catch(function(error) {

        alert(
            "Kameraet kunne ikke startes.\n\n" +
            "Kontroller at kameraadgang er tilladt."
        );

    });

}


/* =========================
   STOP SCANNER
========================= */

function stopScanner() {

    if (scanner) {

        scanner.stop().then(function() {

            scanner.clear();

            scanner = null;

            document.getElementById("scanner").style.display =
                "none";

            document.getElementById("scannerControls").style.display =
                "none";

            document.getElementById("mainMenu").style.display =
                "block";

        });

    } else {

        showMain();

    }

}


/* =========================
   SCANNET VIN
========================= */

function addScannedWine() {

    const barcode =
        document.getElementById("barcode").textContent;

    showAddForm();

    document.getElementById("wineBarcode").value =
        barcode;

}


/* =========================
   TILFØJ VIN MANUELT
========================= */

function showAddForm() {

    document.getElementById("mainMenu").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("scanner").style.display =
        "none";

    document.getElementById("scannerControls").style.display =
        "none";

    document.getElementById("addForm").style.display =
        "block";

}


/* =========================
   TILBAGE
========================= */

function showMain() {

    document.getElementById("mainMenu").style.display =
        "block";

    document.getElementById("addForm").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

}


/* =========================
   GEM VIN
========================= */

function saveWine() {

    const wine = {

        barcode:
            document.getElementById("wineBarcode").value,

        name:
            document.getElementById("wineName").value,

        producer:
            document.getElementById("wineProducer").value,

        year:
            document.getElementById("wineYear").value,

        type:
            document.getElementById("wineType").value,

        country:
            document.getElementById("wineCountry").value,

        quantity:
            document.getElementById("wineQuantity").value,

        location:
            document.getElementById("wineLocation").value,

        notes:
            document.getElementById("wineNotes").value

    };


    localStorage.setItem(
        "testWine",
        JSON.stringify(wine)
    );


    alert(
        "Vinen er gemt midlertidigt på telefonen."
    );


    showMain();

}

</script>

</body>
</html>
