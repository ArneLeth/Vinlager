<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="mit-vinlager-icon.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #72243a;
    color: white;
    padding: 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.page {
    display: none;
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

.page.active {
    display: block;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 16px;
    cursor: pointer;
}

.primary {
    background: #72243a;
    color: white;
}

.secondary {
    background: #ddd;
    color: #222;
}

.success {
    background: #2e7d32;
    color: white;
}

.danger {
    background: #b3261e;
    color: white;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

.home-buttons {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 15px;
}

.status {
    background: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
}

.status.ok {
    border-left: 5px solid #2e7d32;
}

.status.error {
    border-left: 5px solid #b3261e;
}

.status.info {
    border-left: 5px solid #1565c0;
}

.categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.category {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
}

.category strong {
    display: block;
    font-size: 17px;
    margin-bottom: 7px;
}

.category span {
    font-size: 24px;
    font-weight: bold;
    color: #72243a;
}

.scanner-container {
    position: relative;
    width: 100%;
    background: black;
    border-radius: 10px;
    overflow: hidden;
    min-height: 300px;
}

#scanner {
    width: 100%;
}

#scanner video {
    width: 100%;
    height: auto;
}

.scan-line {
    position: absolute;
    left: 10%;
    right: 10%;
    top: 50%;
    height: 2px;
    background: red;
    z-index: 10;
}

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input,
.form-group select,
.form-group textarea,
.search-input {
    width: 100%;
    padding: 11px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-size: 16px;
    background: white;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.photo-preview {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 8px;
    background: #eee;
    margin-bottom: 12px;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.button-row button {
    flex: 1;
    min-width: 130px;
}

.lookup-status {
    padding: 10px;
    background: #fff;
    border-radius: 7px;
    margin: 10px 0;
}

.inventory-controls {
    background: white;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 12px;
}

.inventory-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.wine-card {
    background: white;
    border-radius: 10px;
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
}

.wine-card-image {
    width: 75px;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    background: #eee;
    flex-shrink: 0;
}

.wine-card-info {
    flex: 1;
    min-width: 0;
}

.wine-card-name {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 5px;
}

.wine-card-meta {
    color: #666;
    font-size: 14px;
    line-height: 1.5;
}

.wine-card-quantity {
    font-weight: bold;
    color: #72243a;
    margin-top: 5px;
}

.wine-card button {
    width: auto;
    flex: 0 0 auto;
    padding: 7px 10px;
    margin-left: auto;
    font-size: 13px;
    white-space: nowrap;
}


.detail-info {
    background: white;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.detail-row {
    display: flex;
    border-bottom: 1px solid #eee;
    padding: 8px 0;
}

.detail-label {
    width: 110px;
    font-weight: bold;
}

.detail-value {
    flex: 1;
    word-break: break-word;
}

.back-button {
    margin-bottom: 12px;
}

.empty {
    text-align: center;
    padding: 30px 15px;
    color: #666;
}

.small {
    font-size: 13px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 25px;
}

h2 {
    margin-top: 5px;
}

hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 20px 0;
}

@media (max-width: 500px) {

    .categories {
        grid-template-columns: 1fr 1fr;
    }

    .wine-card {
        align-items: flex-start;
    }

    .wine-card button {
        width: auto;
        flex: 0 0 auto;
        margin-left: auto;
    }
}
</style>
</head>

<script>

/* ============================================================
   GOOGLE DRIVE
   ============================================================ */

const CLIENT_ID =
"701927788585-hfkv438gs0ljn6ln9c05q6p9lsns9j6i.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive.file";

let accessToken = null;

let tokenClient = null;

let wineFolderId = null;

let winesFileId = null;


/* ============================================================
   VINLAGER CACHE
   ============================================================ */

let winesCache = [];

let currentInventoryType = "";

let currentDetailWineId = null;

let detailImageObjectUrl = null;

let scannerRunning = false;

let lastBarcode = "";

let barcodeHits = 0;


/* ============================================================
   GOOGLE LOGIN
   ============================================================ */

function loginGoogle() {

    if (!tokenClient) {

        tokenClient =
            google.accounts.oauth2.initTokenClient({

                client_id: CLIENT_ID,

                scope: DRIVE_SCOPE,

                callback: async (response) => {

                    if (response.error) {

                        setDriveStatus(
                            "Google login fejlede: " +
                            response.error,
                            "error"
                        );

                        return;
                    }

                    accessToken =
                        response.access_token;

                    document
                        .getElementById("googleLoginButton")
                        .style.display = "none";

                    document
                        .getElementById("googleLogoutButton")
                        .style.display = "block";

                    setDriveStatus(
                        "Forbundet til Google Drive",
                        "ok"
                    );

                    try {

                        await getOrCreateWineFolder();

                        await refreshInventory();

                    } catch (error) {

                        console.error(error);

                        setDriveStatus(
                            "Kunne ikke indlæse vinlager: " +
                            error.message,
                            "error"
                        );
                    }

                }

            });
    }

    tokenClient.requestAccessToken({
        prompt: ""
    });
}


/* ============================================================
   LOGOUT
   ============================================================ */

function logoutGoogle() {

    if (accessToken) {

        google.accounts.oauth2.revoke(
            accessToken,
            () => {}
        );
    }

    accessToken = null;

    winesCache = [];

    document
        .getElementById("googleLoginButton")
        .style.display = "block";

    document
        .getElementById("googleLogoutButton")
        .style.display = "none";

    setDriveStatus(
        "Google Drive er ikke tilsluttet",
        "info"
    );

    updateCounts();

    showHome();
}


/* ============================================================
   DRIVE STATUS
   ============================================================ */

function setDriveStatus(text, type) {

    const el =
        document.getElementById("driveStatus");

    el.textContent = text;

    el.className =
        "status " + type;
}


/* ============================================================
   DRIVE REQUEST
   ============================================================ */

async function driveRequest(
    url,
    options = {}
) {

    if (!accessToken) {
        throw new Error(
            "Google Drive er ikke tilsluttet."
        );
    }

    const headers =
        options.headers || {};

    headers.Authorization =
        "Bearer " + accessToken;

    const response =
        await fetch(url, {
            ...options,
            headers
        });

    if (!response.ok) {

        let message =
            response.statusText;

        try {

            const data =
                await response.json();

            if (data.error &&
                data.error.message) {

                message =
                    data.error.message;
            }

        } catch (e) {}

        throw new Error(
            "Google Drive fejl " +
            response.status +
            ": " +
            message
        );
    }

    return response;
}


/* ============================================================
   FIND / OPRET VINLAGER MAPPE
   ============================================================ */

async function getOrCreateWineFolder() {

    const cachedFolderId =
        localStorage.getItem(
            "vinlagerFolderId"
        );

    if (cachedFolderId) {

        try {

            await driveRequest(
                "https://www.googleapis.com/drive/v3/files/" +
                cachedFolderId +
                "?fields=id,name"
            );

            wineFolderId =
                cachedFolderId;

            return wineFolderId;

        } catch (e) {

            localStorage.removeItem(
                "vinlagerFolderId"
            );
        }
    }


    const query =
        encodeURIComponent(
            "name = 'Mit Vinlager' " +
            "and mimeType = 'application/vnd.google-apps.folder' " +
            "and trashed = false"
        );

    const response =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files" +
            "?q=" + query +
            "&spaces=drive" +
            "&fields=files(id,name)"
        );

    const data =
        await response.json();

    if (data.files &&
        data.files.length > 0) {

        wineFolderId =
            data.files[0].id;

        localStorage.setItem(
            "vinlagerFolderId",
            wineFolderId
        );

        return wineFolderId;
    }


    const metadata = {

        name: "Mit Vinlager",

        mimeType:
            "application/vnd.google-apps.folder"

    };

    const createResponse =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(metadata)
            }
        );

    const folder =
        await createResponse.json();

    wineFolderId =
        folder.id;

    localStorage.setItem(
        "vinlagerFolderId",
        wineFolderId
    );

    return wineFolderId;
}


/* ============================================================
   FIND DRIVE FIL
   ============================================================ */

async function findDriveFile(
    fileName
) {

    const query =
        encodeURIComponent(
            "name = '" +
            fileName.replace(/'/g, "\\'") +
            "' " +
            "and '" +
            wineFolderId +
            "' in parents " +
            "and trashed = false"
        );

    const response =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files" +
            "?q=" + query +
            "&spaces=drive" +
            "&fields=files(id,name)"
        );

    const data =
        await response.json();

    if (data.files &&
        data.files.length > 0) {

        return data.files[0];
    }

    return null;
}


/* ============================================================
   LOAD WINES.JSON
   ============================================================ */

async function loadWinesFromDrive() {

    await getOrCreateWineFolder();


    /*
       Først prøver vi det cached fil-ID.
    */

    const cachedFileId =
        localStorage.getItem(
            "vinlagerWinesFileId"
        );

    if (cachedFileId) {

        try {

            const response =
                await driveRequest(
                    "https://www.googleapis.com/drive/v3/files/" +
                    cachedFileId +
                    "?alt=media"
                );

            const text =
                await response.text();

            const wines =
                JSON.parse(text);

            winesFileId =
                cachedFileId;

            winesCache =
                Array.isArray(wines)
                    ? wines
                    : [];

            return winesCache;

        } catch (error) {

            console.log(
                "Cached wines.json kunne ikke bruges",
                error
            );

            localStorage.removeItem(
                "vinlagerWinesFileId"
            );
        }
    }


    /*
       Find wines.json.
    */

    const file =
        await findDriveFile(
            "wines.json"
        );

    if (!file) {

        winesFileId = null;

        winesCache = [];

        return winesCache;
    }


    winesFileId =
        file.id;

    localStorage.setItem(
        "vinlagerWinesFileId",
        winesFileId
    );


    const response =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files/" +
            winesFileId +
            "?alt=media"
        );

    const text =
        await response.text();

    let wines = [];

    try {

        wines =
            JSON.parse(text);

    } catch (error) {

        console.error(
            "wines.json er ugyldig",
            error
        );

        wines = [];
    }


    winesCache =
        Array.isArray(wines)
            ? wines
            : [];

    return winesCache;
}


/* ============================================================
   SAVE WINES.JSON
   ============================================================ */

async function saveWinesToDrive(
    wines
) {

    await getOrCreateWineFolder();


    const json =
        JSON.stringify(
            wines,
            null,
            2
        );


    /*
       Hvis vi allerede kender filen,
       opdaterer vi den direkte.
    */

    if (winesFileId) {

        try {

            const metadata = {
                name: "wines.json",
                mimeType: "application/json"
            };

            const boundary =
                "-------314159265358979323846";

            const delimiter =
                "\r\n--" +
                boundary +
                "\r\n";

            const closeDelimiter =
                "\r\n--" +
                boundary +
                "--";


            const body =
                delimiter +
                "Content-Type: application/json\r\n\r\n" +
                JSON.stringify(metadata) +
                delimiter +
                "Content-Type: application/json\r\n\r\n" +
                json +
                closeDelimiter;


            await driveRequest(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                winesFileId +
                "?uploadType=multipart",
                {

                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "multipart/related; boundary=" +
                            boundary
                    },

                    body: body
                }
            );

            return;

        } catch (error) {

            console.log(
                "Kunne ikke opdatere eksisterende wines.json",
                error
            );

            winesFileId = null;

            localStorage.removeItem(
                "vinlagerWinesFileId"
            );
        }
    }


    /*
       Hvis filen ikke findes,
       opretter vi den.
    */

    const metadata = {

        name: "wines.json",

        mimeType: "application/json",

        parents: [wineFolderId]

    };

    const boundary =
        "-------314159265358979323846";

    const delimiter =
        "\r\n--" +
        boundary +
        "\r\n";

    const closeDelimiter =
        "\r\n--" +
        boundary +
        "--";


    const body =
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        JSON.stringify(metadata) +
        delimiter +
        "Content-Type: application/json\r\n\r\n" +
        json +
        closeDelimiter;


    const response =
        await driveRequest(
            "https://www.googleapis.com/upload/drive/v3/files" +
            "?uploadType=multipart",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "multipart/related; boundary=" +
                        boundary
                },

                body: body
            }
        );


    const file =
        await response.json();

    winesFileId =
        file.id;

    localStorage.setItem(
        "vinlagerWinesFileId",
        winesFileId
    );
}

function updateCounts() {

        "Rødvin": 0,

        "Hvidvin": 0,

        "Rosé": 0,

        "Mousserende": 0,

        "Champagne": 0,

        "Portvin": 0,

        "Spiritus": 0

    };


    winesCache.forEach(
        wine => {

            const type =
                wine.type || "";

            const quantity =
                Number(wine.quantity) || 0;

            if (
                Object.prototype.hasOwnProperty
                    .call(totals, type)
            ) {

                totals[type] += quantity;
            }

        }
    );


    document
        .getElementById("countRed")

/* ============================================================
   RENDER INVENTORY
   ============================================================ */

function renderInventory() {

    const list =
        document.getElementById(
            "inventoryList"
        );

    const search =
        document.getElementById(
            "inventorySearch"
        ).value
        .trim()
        .toLowerCase();

    const type =
        document.getElementById(
            "inventoryTypeFilter"
        ).value;


    let filtered =
        winesCache.filter(
            wine => {

                if (
                    type &&
                    wine.type !== type
                ) {

                    return false;
                }


                if (!search) {
                    return true;
                }


                const searchable = [

                    wine.name,

                    wine.producer,

                    wine.country,

                    wine.barcode,

                    wine.type,

                    wine.location,

                    wine.notes,

                    wine.year

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return searchable
                    .includes(search);
            }
        );


    /*
       Sortér alfabetisk efter navn.
    */

    filtered.sort(
        (a, b) =>
            (a.name || "")
                .localeCompare(
                    b.name || "",
                    "da"
                )
    );


    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Ingen vine fundet.
            </div>
        `;

        return;
    }


    list.innerHTML =
        filtered.map(
            wine => {

                const quantity =
                    Number(wine.quantity) || 0;

                return `
                    <div class="wine-card">

                        ${
                            wine.photoFileId
                            ?
                            `<img
                                id="thumb-${escapeHtml(wine.id)}"
                                class="wine-card-image"
                                alt=""
                            >`
                            :
                            `<div class="wine-card-image"></div>`
                        }

                        <div class="wine-card-info">

                            <div class="wine-card-name">
                                ${escapeHtml(
                                    wine.name ||
                                    "Ukendt vin"
                                )}
                            </div>

                            <div class="wine-card-meta">

                                ${
                                    wine.producer
                                    ?
                                    escapeHtml(
                                        wine.producer
                                    ) +
                                    "<br>"
                                    :
                                    ""
                                }

                                ${
                                    wine.year
                                    ?
                                    escapeHtml(
                                        wine.year
                                    ) +
                                    " · "
                                    :
                                    ""
                                }

                                ${escapeHtml(
                                    wine.type || ""
                                )}

                                ${
                                    wine.country
                                    ?
                                    "<br>" +
                                    escapeHtml(
                                        wine.country
                                    )
                                    :
                                    ""
                                }

                                ${
                                    wine.location
                                    ?
                                    "<br>📍 " +
                                    escapeHtml(
                                        wine.location
                                    )
                                    :
                                    ""
                                }

                            </div>

                            <div class="wine-card-quantity">
                                ${quantity} stk.
                            </div>

                        </div>

                        <button
                            class="primary"
                            onclick="openWineDetail('${escapeJs(
                                wine.id
                            )}')">
                            Vis
                        </button>

                    </div>
                `;
            }
        ).join("");


    /*
       Hent billeder efter kortene er vist.
    */

    filtered.forEach(
        wine => {

            if (wine.photoFileId) {

                loadDriveImage(
                    wine.photoFileId
                ).then(
                    url => {

                        const img =
                            document.getElementById(
                                "thumb-" +
                                wine.id
                            );

                        if (img) {
                            img.src = url;
                        }

                    }
                ).catch(
                    error => {

                        console.log(
                            "Kunne ikke hente miniature",
                            error
                        );

                    }
                );
            }

        }
    );
}

/* ============================================================
   LOAD IMAGE FROM DRIVE
   ============================================================ */

async function loadDriveImage(
    fileId
) {

    const response =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files/" +
            fileId +
            "?alt=media"
        );


    const blob =
        await response.blob();


    return URL.createObjectURL(
        blob
    );
}

/* ============================================================
   START SCANNER
   ============================================================ */

function startScanner() {

    if (scannerRunning) {
        return;
    }


    lastBarcode = "";

    barcodeHits = 0;


    document
        .getElementById("scannerStatus")
        .textContent =
        "Starter kamera...";


    Quagga.offDetected(
       barcodeDetected
    );


    Quagga.init({

        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.getElementById(
                    "scanner"
                ),

            constraints: {

                facingMode: "environment",

                width: {
                    min: 640,
                    ideal: 1280,
                    max: 1920
                },

                height: {
                    min: 480,
                    ideal: 720,
                    max: 1080
                },

                focusMode: "continuous"

            }

        },

        locator: {

            patchSize: "medium",

            halfSample: true

        },

        numOfWorkers:
            navigator.hardwareConcurrency
            ? Math.min(
                4,
                navigator.hardwareConcurrency
            )
            : 2,

        frequency: 15,

        decoder: {

            readers: [

                "ean_reader",

                "ean_8_reader"

            ]

        },

        locate: true

    }, function(error) {

        if (error) {

            console.error(error);

            document
                .getElementById(
                    "scannerStatus"
                )
                .textContent =
                "Kamera kunne ikke startes: " +
                error.message;

            return;
        }


        scannerRunning =
            true;

        Quagga.start();


        document
            .getElementById(
                "scannerStatus"
            )
            .textContent =
            "Scan stregkoden...";
    });


    Quagga.onDetected(
        barcodeDetected
    );
}


/* ============================================================
   BARCODE DETECTED
   ============================================================ */

function barcodeDetected(
    result
) {

    if (!result ||
        !result.codeResult) {

        return;
    }


    const code =
        result.codeResult.code;


    if (!code) {
        return;
    }


    /*
       Kræv samme stregkode
       flere gange før vi accepterer.
    */

    if (code === lastBarcode) {

        barcodeHits++;

    } else {

        lastBarcode =
            code;

        barcodeHits = 1;
    }


    document
        .getElementById(
            "scannerStatus"
        )
        .textContent =
        "Fundet: " +
        code +
        " (" +
        barcodeHits +
        "/2)";


    if (barcodeHits >= 2) {

        stopScanner();

        handleBarcode(
            code
        );
    }
}


/* ============================================================
   STOP SCANNER
   ============================================================ */

function stopScanner() {

    if (!scannerRunning) {
        return;
    }


    try {
        Quagga.stop();
    } catch (e) {}


    Quagga.offDetected(
        barcodeDetected
    );

    scannerRunning =
        false;
}


/* ============================================================
   CLOSE SCANNER
   ============================================================ */

function closeScanner() {

    stopScanner();

}

async function handleBarcode(

) {

    resetWineForm();

            );


        if (product) {

            fillWineFromProduct(
                product
            );

            status.textContent =
                "✓ Produkt fundet i Open Food Facts.";

            status.className =
                "lookup-status";

        } else {

            status.textContent =
                "Produktet blev ikke fundet. " +
                "Du kan indtaste oplysningerne manuelt.";

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Kunne ikke slå produktet op. " +
            "Du kan indtaste oplysningerne manuelt.";
    }
}


/* ============================================================
   OPEN FOOD FACTS
   ============================================================ */

async function lookupOpenFoodFacts(
    barcode
) {

    const fields = [

        "code",

        "product_name",

        "product_name_da",

        "generic_name",

        "generic_name_da",

        "brands",

        "categories",

        "categories_tags",

        "countries",

        "countries_tags",

        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/" +
        encodeURIComponent(barcode) +
        "?product_type=all" +
        "&lc=da" +
        "&cc=dk" +
        "&fields=" +
        encodeURIComponent(fields);


    const response =
        await fetch(url, {

            headers: {

                "User-Agent":
                    "MitVinlager/1.0"

            }

        });


    if (!response.ok) {

        throw new Error(
            "Open Food Facts HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    if (!data.product) {
        return null;
    }


    return data.product;
}


/* ============================================================
   FILL WINE FROM PRODUCT
   ============================================================ */

function fillWineFromProduct(
    product
) {

    const name =
        product.product_name_da ||
        product.product_name ||
        product.generic_name_da ||
        product.generic_name ||
        "";


    const producer =
        product.brands ||
        "";


    const country =
        extractCountry(
            product
        );


    const type =
        detectWineType(
            product
        );


    document
        .getElementById("wineName")
        .value =
        name;


    document
        .getElementById("producer")
        .value =
        producer;


    document
        .getElementById("country")
        .value =
        country;


    document
        .getElementById("wineType")
        .value =
        type;
}


/* ============================================================
   EXTRACT COUNTRY
   ============================================================ */

function extractCountry(
    product
) {

    const tags =
        product.countries_tags ||
        [];


    if (tags.length > 0) {

        const value =
            tags[0]
                .replace(
                    /^en:/,
                    ""
                )
                .replace(
                    /^da:/,
                    ""
                )
                .replace(
                    /-/g,
                    " "
                );


        return value;
    }


    return product.countries || "";
}


/* ============================================================
   CLEAN TEXT
   ============================================================ */

function productText(
    product
) {

    return [

        product.product_name,

        product.product_name_da,

        product.generic_name,

        product.generic_name_da,

        product.brands,

        product.categories,

        ...(product.categories_tags || [])

    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();
}


/* ============================================================
   DETECT WINE TYPE
   ============================================================ */

function detectWineType(
    product
) {

    const text =
        productText(
            product
        );


    /*
       Champagne først
    */

    if (
        text.includes("champagne") ||
        text.includes("champagne wine")
    ) {

        return "Champagne";
    }


    /*
       Portvin
    */

    if (
        text.includes("portvin") ||
        text.includes("port wine") ||
        text.includes("porto") ||
        text.includes("vin de porto")
    ) {

        return "Portvin";
    }


    /*
       Spiritus
    */

    if (
        text.includes("spirit") ||
        text.includes("whisky") ||
        text.includes("whiskey") ||
        text.includes("vodka") ||
        text.includes("gin") ||
        text.includes("rum") ||
        text.includes("tequila") ||
        text.includes("brandy") ||
        text.includes("cognac") ||
        text.includes("liqueur") ||
        text.includes("likør") ||
        text.includes("aquavit") ||
        text.includes("schnaps")
    ) {

        return "Spiritus";
    }


    /*
       Mousserende
    */

    if (
        text.includes("sparkling") ||
        text.includes("mousserende") ||
        text.includes("prosecco") ||
        text.includes("cava") ||
        text.includes("crémant") ||
        text.includes("cremant") ||
        text.includes("sekt") ||
        text.includes("spumante") ||
        text.includes("frizzante")
    ) {

        return "Mousserende";
    }


    /*
       ROSÉ
       Skal ligge før rødvin/hvidvin.
    */

    if (
        text.includes("rosé") ||
        text.includes("rose wine") ||
        text.includes("rosé wine") ||
        text.includes("vin rosé") ||
        text.includes("vino rosato") ||
        text.includes("rosato") ||
        text.includes("rosado") ||
        text.includes("rosévin") ||
        text.includes("rosevin")
    ) {

        return "Rosé";
    }


    /*
       Hvidvin
    */

    if (
        text.includes("white wine") ||
        text.includes("hvidvin") ||
        text.includes("vin blanc") ||
        text.includes("vino bianco") ||
        text.includes("weisswein") ||
        text.includes("weißwein")
    ) {

        return "Hvidvin";
    }


    /*
       Rødvin
    */

    if (
        text.includes("red wine") ||
        text.includes("rødvin") ||
        text.includes("vin rouge") ||
        text.includes("vino tinto") ||
        text.includes("vino rosso") ||
        text.includes("rotwein")
    ) {

        return "Rødvin";
    }


    /*
       Standard
    */

    return "Rødvin";
}


/* ============================================================
   PHOTO PREVIEW
   ============================================================ */

document
    .getElementById("photo")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            const preview =
                document
                    .getElementById(
                        "photoPreview"
                    );


            if (!file) {

                preview.style.display =
                    "none";

                return;
            }


            const url =
                URL.createObjectURL(
                    file
                );


            preview.src =
                url;

            preview.style.display =
                "block";
        }
    );


/* ============================================================
   COMPRESS IMAGE
   ============================================================ */

function compressImage(
    file,
    maxWidth = 1000,
    quality = 0.72
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width >
                                maxWidth
                            ) {

                                height =
                                    Math.round(
                                        height *
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;
                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                "Kunne ikke komprimere billedet."
                                            )
                                        );

                                        return;
                                    }

                                    resolve(blob);

                                },
                                "image/jpeg",
                                quality
                            );

                        };


                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;
                };


            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* ============================================================
   UPLOAD PHOTO
   ============================================================ */

async function uploadWinePhoto(
    blob,
    fileName
) {

    await getOrCreateWineFolder();


    const metadata = {

        name: fileName,

        mimeType: "image/jpeg",

        parents: [
            wineFolderId
        ]

    };


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--" +
        boundary +
        "\r\n";


    const closeDelimiter =
        "\r\n--" +
        boundary +
        "--";


    const metadataPart =
        delimiter +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata);


    const filePart =
        delimiter +
        "Content-Type: image/jpeg\r\n\r\n";


    const blobBuffer =
        await blob.arrayBuffer();


    const encoder =
        new TextEncoder();


    const start =
        encoder.encode(
            metadataPart +
            filePart
        );

    const end =
        encoder.encode(
            closeDelimiter
        );


    const combined =
        new Uint8Array(
            start.length +
            blobBuffer.byteLength +
            end.length
        );


    combined.set(
        start,
        0
    );

    combined.set(
        new Uint8Array(
            blobBuffer
        ),
        start.length
    );

    combined.set(
        end,
        start.length +
        blobBuffer.byteLength
    );


    const response =
        await driveRequest(
            "https://www.googleapis.com/upload/drive/v3/files" +
            "?uploadType=multipart",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "multipart/related; boundary=" +
                        boundary

                },

                body: combined

            }
        );


    const fileData =
        await response.json();


    return fileData.id;
}


/* ============================================================
   SAVE NEW WINE
   ============================================================ */

async function saveWine() {

    if (!accessToken) {

        alert(
            "Forbind først Google Drive."
        );

        return;
    }


    const name =
        document
            .getElementById(
                "wineName"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Indtast vinens navn."
        );

        return;
    }


    const quantity =
        parseInt(
            document
                .getElementById(
                    "quantity"
                )
                .value,
            10
        );


    if (
        isNaN(quantity) ||
        quantity < 0
    ) {

        alert(
            "Antal skal være 0 eller større."
        );

        return;
    }


    const saveButton =
        document.querySelector(
            "#wineFormPage .success"
        );


    saveButton.disabled =
        true;

    saveButton.textContent =
        "Gemmer...";


    try {

        let photoFileId =
            null;


        /*
           Upload billede først,
           hvis brugeren har valgt et.
        */

        const photoInput =
            document
                .getElementById(
                    "photo"
                );


        if (
            photoInput.files &&
            photoInput.files.length > 0
        ) {

            const originalFile =
                photoInput.files[0];


            const compressed =
                await compressImage(
                    originalFile,
                    1000,
                    0.72
                );


            const fileName =
                "vin-" +
                Date.now() +
                ".jpg";


            photoFileId =
                await uploadWinePhoto(
                    compressed,
                    fileName
                );
        }


        const wine = {

            id:
                crypto.randomUUID
                ? crypto.randomUUID()
                :
                String(
                    Date.now()
                ),

            barcode:
                document
                    .getElementById(
                        "barcode"
                    )
                    .value
                    .trim(),

            name:
                name,

            producer:
                document
                    .getElementById(
                        "producer"
                    )
                    .value
                    .trim(),

            year:
                document
                    .getElementById(
                        "year"
                    )
                    .value
                    .trim(),

            type:
                document
                    .getElementById(
                        "wineType"
                    )
                    .value,

            country:
                document
                    .getElementById(
                        "country"
                    )
                    .value
                    .trim(),

            quantity:
                quantity,

            location:
                document
                    .getElementById(
                        "location"
                    )
                    .value
                    .trim(),

            notes:
                document
                    .getElementById(
                        "notes"
                    )
                    .value
                    .trim(),

            photoFileId:
                photoFileId,

            dateAdded:
                new Date()
                    .toISOString()

        };


        /*
           Sørg for at vi har
           den seneste version af lageret.
        */

        await loadWinesFromDrive();


        winesCache.push(
            wine
        );


        /*
           Gem kun JSON én gang.
        */

        await saveWinesToDrive(
            winesCache
        );


        updateCounts();


        /*
           Nulstil formularen
           efter vellykket gem.
        */

        resetWineForm();


        alert(
            "✓ Vinen er gemt i vinlageret."
        );


        showHome();


    } catch (error) {

        console.error(error);

        alert(
            "Kunne ikke gemme vinen:\n\n" +
            error.message
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "💾 Gem vin";
    }
}


/* ============================================================
   PAGE NAVIGATION
   ============================================================ */

function showPage(
    pageId
) {

    document
        .querySelectorAll(".page")
        .forEach(
            page => {

                page.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(pageId)
        .classList.add(
            "active"
        );


    window.scrollTo(
        0,
        0
    );
}


/* ============================================================
   HOME
   ============================================================ */

function showHome() {

    stopScanner();

    showPage(
        "homePage"
    );
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* ============================================================
   ESCAPE JS
   ============================================================ */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\n/g,
        "\\n"
    )
    .replace(
        /\r/g,
        "\\r"
    );
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

window.addEventListener(
    "load",
    function() {

        updateCounts();

    }
);
