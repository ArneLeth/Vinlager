<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vinlager">
<title>Mit Vinlager</title>

<script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f2;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:600px;margin:auto;padding:20px}
h1{text-align:center;margin:10px 0 5px;font-size:30px}
h2{margin-top:5px}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
button{width:100%;border:0;border-radius:14px;padding:16px;margin:7px 0;font-size:17px;font-weight:600;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
button:disabled{opacity:.5}
.scan{font-size:20px;padding:21px;background:#222;color:#fff}
.category{text-align:left;font-weight:500}
.count{float:right;color:#888}
.save{background:#222;color:#fff}
.back{background:#ddd;color:#222}
.google{background:#4285f4;color:#fff}
.logout{background:#eee;color:#444}
#homePage{display:block}#scannerPage,#addPage,#scanResult,#searchPage{display:none}
#googleStatus{text-align:center;padding:10px;margin:10px 0 15px;border-radius:10px;background:#eee;color:#666;font-size:14px}
#camera{position:relative;width:100%;overflow:hidden;border-radius:16px;background:#000}
#camera video{width:100%;height:auto;display:block}
#camera canvas.drawingBuffer{position:absolute;top:0;left:0}
.scanbox{position:absolute;top:35%;left:5%;width:90%;height:30%;border:3px solid #fff;border-radius:8px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.2)}
.scanline{position:absolute;top:50%;left:5%;width:90%;height:2px;background:red;pointer-events:none}
.scanner-info{text-align:center;margin:15px 0;color:#666}
#scanResult{margin-top:15px;padding:20px;background:#fff;border-radius:14px;text-align:center}
.barcode{font-size:21px;font-weight:bold;margin:12px 0;letter-spacing:1px}
.lookupStatus{padding:14px;margin:12px 0;border-radius:12px;text-align:center;background:#f1f1f1;color:#555;font-size:15px}
.lookupSuccess{background:#e8f5e9;color:#216b2a}.lookupWarning{background:#fff3cd;color:#745b00}.lookupError{background:#f8d7da;color:#842029}
.form input,.form select,.form textarea,#searchInput{width:100%;padding:14px;margin:6px 0 14px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
.form label{font-weight:600}
.photo-section{margin-top:10px;margin-bottom:15px}
#photoPreview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;display:none;background:#eee;margin-top:10px}
.searchBox{position:relative}.searchBox input{margin-bottom:8px}
.result{background:#fff;border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.resultTitle{font-weight:700;font-size:17px}.resultMeta{color:#666;font-size:14px;margin-top:4px}
.empty{text-align:center;color:#777;padding:25px}
@media(max-width:400px){.app{padding:15px}h1{font-size:26px}button{padding:15px}}
</style>
</head>

<body>
<div class="app">

<!-- FORSIDE -->
<div id="homePage">
<h1>🍷 Mit Vinlager</h1>
<div class="subtitle">Dit private vinlager</div>

<div id="googleStatus">☁️ Ikke forbundet til Google Drive</div>

<button id="googleLoginButton" class="google" onclick="loginGoogle()">☁️ Log ind med Google Drive</button>
<button id="googleLogoutButton" class="logout" onclick="logoutGoogle()" style="display:none">Log ud af Google</button>

<button class="scan" onclick="startScanner()">📷 Scan vin</button>
<button onclick="showAddForm('')">➕ Tilføj vin</button>
<button onclick="showSearch()">🔎 Søg i vinlager</button>

<br>

<button class="category" onclick="showCategory('Rødvin')">🍷 Rødvin <span class="count" id="countRødvin">0</span></button>
<button class="category" onclick="showCategory('Hvidvin')">🥂 Hvidvin <span class="count" id="countHvidvin">0</span></button>
<button class="category" onclick="showCategory('Rosévin')">🌸 Rosévin <span class="count" id="countRosévin">0</span></button>
<button class="category" onclick="showCategory('Mousserende')">🫧 Mousserende <span class="count" id="countMousserende">0</span></button>
<button class="category" onclick="showCategory('Champagne')">🍾 Champagne <span class="count" id="countChampagne">0</span></button>
<button class="category" onclick="showCategory('Portvin')">🍷 Portvin <span class="count" id="countPortvin">0</span></button>
<button class="category" onclick="showCategory('Spiritus')">🥃 Spiritus <span class="count" id="countSpiritus">0</span></button>
</div>

<!-- SCANNER -->
<div id="scannerPage">
<h2>📷 Scan vin</h2>
<div class="scanner-info">Placer stregkoden inden for rammen</div>
<div id="camera"><div class="scanbox"></div><div class="scanline"></div></div>
<div id="scannerStatus" class="scanner-info">Starter kamera…</div>
<button onclick="closeScanner()" class="back">← Luk scanner</button>
</div>

<!-- SCAN RESULTAT -->
<div id="scanResult">
<div>Stregkode fundet</div>
<div id="barcode" class="barcode"></div>
<div id="lookupStatus" class="lookupStatus">Søger efter vin...</div>
<button id="addFoundWineButton" onclick="continueWithBarcode()">➕ Tilføj denne vin</button>
<button onclick="scanAgain()" class="back">📷 Scan igen</button>
</div>

<!-- TILFØJ VIN -->
<div id="addPage" class="form">
<h2>➕ Tilføj vin</h2>
<div id="formLookupStatus" class="lookupStatus" style="display:none"></div>

<label>Stregkode</label><input id="wineBarcode" type="text" inputmode="numeric">
<label>Navn</label><input id="wineName" type="text" placeholder="Vinens navn">
<label>Producent</label><input id="wineProducer" type="text" placeholder="Producent">
<label>Årgang</label><input id="wineYear" type="number" placeholder="Fx 2020">

<label>Type</label>
<select id="wineType">
<option value="Rødvin">🍷 Rødvin</option>
<option value="Hvidvin">🥂 Hvidvin</option>
<option value="Rosévin">🌸 Rosévin</option>
<option value="Mousserende">🫧 Mousserende</option>
<option value="Champagne">🍾 Champagne</option>
<option value="Portvin">🍷 Portvin</option>
<option value="Spiritus">🥃 Spiritus</option>
</select>

<label>Land</label><input id="wineCountry" type="text" placeholder="Fx Italien">
<label>Antal</label><input id="wineQuantity" type="number" value="1" min="1">
<label>Placering</label><input id="wineLocation" type="text" placeholder="Fx Reol 2, hylde 3">

<div class="photo-section">
<label>📸 Billede af etiketten</label>
<input id="winePhoto" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)">
<img id="photoPreview">
</div>

<label>Noter</label>
<textarea id="wineNotes" rows="4" placeholder="Dine egne noter"></textarea>

<button class="save" id="saveButton" onclick="saveWine()">💾 Gem vin</button>
<button class="back" onclick="showHome()">← Tilbage</button>
</div>

<!-- SØG -->
<div id="searchPage">
<h2>🔎 Søg i vinlager</h2>
<div class="searchBox">
<input id="searchInput" type="search" placeholder="Søg på vin, producent, land, stregkode..." oninput="renderSearchResults()">
</div>
<div id="searchResults"></div>
<button class="back" onclick="showHome()">← Tilbage</button>
</div>

</div>

<script>
/* ================= GOOGLE ================= */
const GOOGLE_CLIENT_ID="701927788585-hfkv438gs0ljn6ln9c05q6p9lsns9j6i.apps.googleusercontent.com";
const GOOGLE_SCOPE="https://www.googleapis.com/auth/drive.file";

let googleTokenClient=null;
let googleAccessToken=null;
let googleFolderId=localStorage.getItem("vinlagerGoogleFolderId");
let winesCache=null;
let winesCacheTime=0;
const CACHE_TTL=60000;

async function loginGoogle(){
 if(!window.google?.accounts?.oauth2){
   alert("Google-login er ikke indlæst endnu. Prøv igen om et øjeblik."); return;
 }
 googleTokenClient=google.accounts.oauth2.initTokenClient({
   client_id:GOOGLE_CLIENT_ID,
   scope:GOOGLE_SCOPE,
   callback:async response=>{
     if(response.error){
       console.error(response);
       document.getElementById("googleStatus").textContent="❌ Google-login fejlede.";
       return;
     }
     googleAccessToken=response.access_token;
     document.getElementById("googleStatus").textContent="☁️ Forbinder til Google Drive…";
     document.getElementById("googleLoginButton").style.display="none";
     document.getElementById("googleLogoutButton").style.display="block";
     try{
       await getOrCreateWineFolder();
       await loadWinesFromDrive(true);
       updateCounts();
       document.getElementById("googleStatus").textContent="✅ Google Drive klar – Mit Vinlager";
     }catch(e){
       console.error(e);
       document.getElementById("googleStatus").textContent="⚠️ Google er logget ind, men Drive kunne ikke åbnes.";
     }
   }
 });
 googleTokenClient.requestAccessToken({prompt:"consent"});
}

function logoutGoogle(){
 if(googleAccessToken && window.google) google.accounts.oauth2.revoke(googleAccessToken);
 googleAccessToken=null; winesCache=null;
 document.getElementById("googleStatus").textContent="☁️ Ikke forbundet til Google Drive";
 document.getElementById("googleLoginButton").style.display="block";
 document.getElementById("googleLogoutButton").style.display="none";
}

async function driveRequest(url,options={}){
 if(!googleAccessToken) throw new Error("Ikke logget ind på Google Drive.");
 options.headers={...(options.headers||{}),Authorization:"Bearer "+googleAccessToken};
 const r=await fetch(url,options);
 if(!r.ok){
   let msg="";
   try{const d=await r.json();msg=d.error?.message||JSON.stringify(d)}catch{msg=await r.text()}
   throw new Error(msg);
 }
 return r;
}

async function getOrCreateWineFolder(){
 if(googleFolderId) return googleFolderId;
 const q="name='Mit Vinlager' and mimeType='application/vnd.google-apps.folder' and trashed=false";
 const url="https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&spaces=drive&fields=files(id,name)";
 const data=await (await driveRequest(url)).json();
 if(data.files?.length){
   googleFolderId=data.files[0].id;
 }else{
   const r=await driveRequest("https://www.googleapis.com/drive/v3/files",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({name:"Mit Vinlager",mimeType:"application/vnd.google-apps.folder"})
   });
   googleFolderId=(await r.json()).id;
 }
 localStorage.setItem("vinlagerGoogleFolderId",googleFolderId);
 return googleFolderId;
}

async function findDriveFile(fileName){
 const q="name='"+fileName.replace(/'/g,"\\'")+"' and '"+googleFolderId+"' in parents and trashed=false";
 const url="https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&spaces=drive&fields=files(id,name,mimeType)";
 const data=await (await driveRequest(url)).json();
 return data.files?.[0]||null;
}

/* Hurtigere: wines.json hentes kun én gang pr. session/cacheperiode. */
async function loadWinesFromDrive(force=false){
 if(!force && winesCache && Date.now()-winesCacheTime<CACHE_TTL) return winesCache;
 const file=await findDriveFile("wines.json");
 if(!file){winesCache=[];winesCacheTime=Date.now();return winesCache}
 const text=await (await driveRequest("https://www.googleapis.com/drive/v3/files/"+file.id+"?alt=media")).text();
 try{winesCache=JSON.parse(text);if(!Array.isArray(winesCache))winesCache=[]}
 catch{winesCache=[]}
 winesCacheTime=Date.now();
 return winesCache;
}

/* Hurtigere end den gamle løsning: gemmer kun wines.json én gang efter ændringen. */
async function saveWinesToDrive(wines){
 const json=JSON.stringify(wines);
 const existing=await findDriveFile("wines.json");
 const boundary="----VinlagerBoundary"+Date.now();
 const metadata={name:"wines.json",mimeType:"application/json",...(existing?{}:{parents:[googleFolderId]})};
 const body=[
   "--"+boundary,
   "Content-Type: application/json; charset=UTF-8","",
   JSON.stringify(metadata),
   "--"+boundary,
   "Content-Type: application/json","",
   json,
   "--"+boundary+"--",""
 ].join("\r\n");
 const url=existing
   ?"https://www.googleapis.com/upload/drive/v3/files/"+existing.id+"?uploadType=multipart"
   :"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
 await driveRequest(url,{
   method:existing?"PATCH":"POST",
   headers:{"Content-Type":"multipart/related; boundary="+boundary},
   body
 });
 winesCache=wines;
 winesCacheTime=Date.now();
}

/* ================= BILLEDE ================= */
function compressImage(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=e=>{
     const img=new Image();
     img.onload=()=>{
       const MAX=900;
       let w=img.width,h=img.height;
       if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
       const c=document.createElement("canvas");c.width=w;c.height=h;
       c.getContext("2d").drawImage(img,0,0,w,h);
       c.toBlob(b=>b?resolve(b):reject(new Error("Kunne ikke komprimere billedet.")),"image/jpeg",.70);
     };
     img.onerror=reject;img.src=e.target.result;
   };
   reader.onerror=reject;reader.readAsDataURL(file);
 });
}

async function uploadWinePhoto(file,wineId){
 const compressed=await compressImage(file);
 const metadata={name:"vin_"+wineId+".jpg",mimeType:"image/jpeg",parents:[googleFolderId]};
 const boundary="----VinPhotoBoundary"+Date.now();
 const blob=new Blob([
   "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n",
   JSON.stringify(metadata),
   "\r\n--"+boundary+"\r\nContent-Type: image/jpeg\r\n\r\n",
   compressed,
   "\r\n--"+boundary+"--\r\n"
 ],{type:"multipart/related; boundary="+boundary});
 const r=await driveRequest("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
   method:"POST",headers:{"Content-Type":"multipart/related; boundary="+boundary},body:blob
 });
 return (await r.json()).id;
}

/* ================= SCANNER ================= */
let scannerRunning=false,lastCode="",detectionCount=0;
const REQUIRED_DETECTIONS=2;
let lookupWineData=null;

function startScanner(){
 showOnly("scannerPage");
 lastCode="";detectionCount=0;
 document.getElementById("scannerStatus").textContent="Starter kamera…";
 const config={
  inputStream:{
   name:"Live",type:"LiveStream",target:document.querySelector("#camera"),
   constraints:{width:{min:640,ideal:1280},height:{min:480,ideal:720},facingMode:{ideal:"environment"},focusMode:"continuous"},
   area:{top:"25%",right:"5%",left:"5%",bottom:"25%"}
  },
  locator:{patchSize:"medium",halfSample:true},
  frequency:15,
  decoder:{readers:["ean_reader","ean_8_reader"]},
  locate:true,numOfWorkers:navigator.hardwareConcurrency?Math.min(navigator.hardwareConcurrency,4):2
 };
 Quagga.init(config,error=>{
  if(error){console.error(error);document.getElementById("scannerStatus").textContent="Kameraet kunne ikke startes.";return}
  Quagga.start();scannerRunning=true;
  document.getElementById("scannerStatus").textContent="Scanner…";
  Quagga.onDetected(barcodeDetected);
 });
}

function barcodeDetected(result){
 const code=result?.codeResult?.code,format=result?.codeResult?.format;
 if(!code || !["ean_13","ean_8"].includes(format))return;
 if(code===lastCode)detectionCount++;else{lastCode=code;detectionCount=1}
 document.getElementById("scannerStatus").textContent="EAN fundet – bekræfter…";
 if(detectionCount>=REQUIRED_DETECTIONS)finishScan(code);
}
function finishScan(code){
 stopScanner();lookupWineData=null;
 document.getElementById("barcode").textContent=code;
 showOnly("scanResult");lookupWine(code);
}
function stopScanner(){
 if(!scannerRunning)return;
 try{Quagga.offDetected(barcodeDetected);Quagga.stop()}catch(e){console.log(e)}
 scannerRunning=false;
}
function closeScanner(){stopScanner();showHome()}
function scanAgain(){lookupWineData=null;startScanner()}

/* ================= OPSLAG ================= */
async function lookupWine(code){
 const status=document.getElementById("lookupStatus");
 status.className="lookupStatus";status.textContent="🔎 Søger efter vin…";
 const fields=["code","product_name","product_name_da","generic_name","generic_name_da","brands","categories","categories_tags","countries","countries_tags","origins"].join(",");
 const url="https://world.openfoodfacts.org/api/v3/product/"+encodeURIComponent(code)+"?product_type=all&lc=da&cc=dk&fields="+encodeURIComponent(fields);
 try{
  const r=await fetch(url);
  if(!r.ok){
   lookupWineData=null;status.className="lookupStatus lookupWarning";
   status.textContent="⚠️ Stregkoden findes ikke i databasen. Du kan indtaste vinen manuelt.";return;
  }
  const data=await r.json(),p=data.product;
  if(!p){lookupWineData=null;status.className="lookupStatus lookupWarning";status.textContent="⚠️ Vinen blev ikke fundet i databasen.";return}
  const name=p.product_name_da||p.product_name||p.generic_name_da||p.generic_name||"";
  lookupWineData={name,producer:p.brands||"",country:extractCountry(p),type:detectWineType(p)};
  status.className="lookupStatus lookupSuccess";
  status.textContent=name?"✅ Vin fundet: "+name+". Kontrollér oplysningerne før du gemmer.":"✅ Stregkoden blev fundet, men der mangler vinoplysninger.";
 }catch(e){
  console.error(e);lookupWineData=null;status.className="lookupStatus lookupError";
  status.textContent="⚠️ Kunne ikke kontakte vin-databasen. Du kan stadig indtaste vinen manuelt.";
 }
}

function extractCountry(p){
 if(Array.isArray(p.countries_tags)&&p.countries_tags.length)return cleanTaxonomyValue(p.countries_tags[0]);
 if(p.countries)return p.countries.split(",")[0].trim();
 if(p.origins)return p.origins.split(",")[0].trim();
 return "";
}
function cleanTaxonomyValue(v){if(!v)return "";const a=v.split(":");return (a.length>1?a.slice(1).join(":"):a[0]).replace(/-/g," ")}
function detectWineType(p){
 const text=((p.product_name||"")+" "+(p.product_name_da||"")+" "+(p.generic_name||"")+" "+(p.categories||"")+" "+(Array.isArray(p.categories_tags)?p.categories_tags.join(" "):"")).toLowerCase();
 if(text.includes("champagne"))return"Champagne";
 if(/port wine|portwine|portvin|porto/.test(text))return"Portvin";
 if(/sparkling|mousser|prosecco|cava|crémant|cremant|sekt/.test(text))return"Mousserende";
 if(/spirit|whisky|whiskey|vodka|gin|rum|brandy|cognac|liqueur|likør/.test(text))return"Spiritus";
 if(/rosé|rose wine|rose-wine|rosévin|rosevin|vin rosé|vino rosato|rosato/.test(text))return"Rosévin";
 if(/white wine|white-wine|hvidvin|vino bianco|vin blanc|weisswein|weißwein/.test(text))return"Hvidvin";
 if(/red wine|red-wine|rødvin|vino rosso|vin rouge|rotwein/.test(text))return"Rødvin";
 return"Rødvin";
}

/* ================= FORM ================= */
function continueWithBarcode(){showAddForm(document.getElementById("barcode").textContent,lookupWineData)}

function resetWineForm(){
 document.querySelectorAll("#addPage input").forEach(i=>{
  if(i.type==="file")i.value="";
  else if(i.type==="number")i.value=i.id==="wineQuantity"?"1":"";
  else i.value="";
 });
 document.getElementById("wineType").selectedIndex=0;
 document.getElementById("wineNotes").value="";
 const p=document.getElementById("photoPreview");p.removeAttribute("src");p.style.display="none";
 const s=document.getElementById("formLookupStatus");s.style.display="none";s.textContent="";s.className="lookupStatus";
}

function showAddForm(code,wineData){
 showOnly("addPage");resetWineForm();
 if(code)document.getElementById("wineBarcode").value=code;
 if(wineData){
  document.getElementById("wineName").value=wineData.name||"";
  document.getElementById("wineProducer").value=wineData.producer||"";
  document.getElementById("wineCountry").value=wineData.country||"";
  document.getElementById("wineType").value=wineData.type||"Rødvin";
  const s=document.getElementById("formLookupStatus");s.style.display="block";s.className="lookupStatus lookupSuccess";
  s.textContent="✅ Oplysninger hentet automatisk. Kontrollér dem før du gemmer.";
 }
}
function previewPhoto(e){
 const f=e.target.files[0];if(!f)return;
 const img=document.getElementById("photoPreview");img.src=URL.createObjectURL(f);img.style.display="block";
}

async function saveWine(){
 const saveBtn=document.getElementById("saveButton");
 if(saveBtn.disabled)return;
 const wine={
  id:Date.now().toString(),
  barcode:document.getElementById("wineBarcode").value.trim(),
  name:document.getElementById("wineName").value.trim(),
  producer:document.getElementById("wineProducer").value.trim(),
  year:document.getElementById("wineYear").value,
  type:document.getElementById("wineType").value,
  country:document.getElementById("wineCountry").value.trim(),
  quantity:Math.max(1,parseInt(document.getElementById("wineQuantity").value)||1),
  location:document.getElementById("wineLocation").value.trim(),
  notes:document.getElementById("wineNotes").value.trim(),
  photoFileId:null,dateAdded:new Date().toISOString()
 };
 if(!wine.name && !wine.barcode){alert("Indtast mindst vinens navn eller stregkode.");return}

 localStorage.setItem("testWine",JSON.stringify(wine));
 saveBtn.disabled=true;saveBtn.textContent="☁️ Gemmer…";

 try{
  if(!googleAccessToken){
   alert("Vinen er gemt lokalt. Log ind med Google Drive for at gemme den i dit Google Drive.");
   return;
  }
  await getOrCreateWineFolder();
  const photo=document.getElementById("winePhoto").files[0]||null;
  const status=document.getElementById("formLookupStatus");status.style.display="block";status.className="lookupStatus";

  if(photo){
   status.textContent="☁️ Gemmer billede…";
   wine.photoFileId=await uploadWinePhoto(photo,wine.id);
  }

  /* Brug cache: vi behøver ikke hente wines.json igen lige efter login/gemning. */
  const wines=await loadWinesFromDrive(false);
  wines.push(wine);
  status.textContent="☁️ Gemmer vinlager…";
  await saveWinesToDrive(wines);
  updateCounts();
  alert("✅ Vinen er gemt i Google Drive.");
  resetWineForm();showHome();
 }catch(e){
  console.error(e);
  alert("⚠️ Der opstod en fejl ved gemning til Google Drive.\n\nVinen er gemt lokalt på telefonen.\n\nFejl: "+e.message);
  resetWineForm();showHome();
 }finally{
  saveBtn.disabled=false;saveBtn.textContent="💾 Gem vin";
 }
}

/* ================= SØGNING + ANTAL ================= */
function updateCounts(){
 const counts={Rødvin:0,Hvidvin:0,"Rosévin":0,Mousserende:0,Champagne:0,Portvin:0,Spiritus:0};
 (winesCache||[]).forEach(w=>{const q=Math.max(0,parseInt(w.quantity)||0);if(counts[w.type]!==undefined)counts[w.type]+=q});
 Object.keys(counts).forEach(t=>{const el=document.getElementById("count"+t);if(el)el.textContent=counts[t]});
}

async function showSearch(){
 showOnly("searchPage");
 document.getElementById("searchInput").value="";
 document.getElementById("searchResults").innerHTML='<div class="empty">☁️ Henter vinlager…</div>';
 try{
  if(googleAccessToken)await loadWinesFromDrive(false);
  else{
   const local=localStorage.getItem("testWine");
   winesCache=local?[JSON.parse(local)]:[];
  }
  renderSearchResults();
 }catch(e){document.getElementById("searchResults").innerHTML='<div class="empty">⚠️ Kunne ikke hente vinlageret.</div>'}
}

function renderSearchResults(){
 const box=document.getElementById("searchResults");
 if(!winesCache){box.innerHTML='<div class="empty">Ingen vine indlæst.</div>';return}
 const term=(document.getElementById("searchInput").value||"").toLowerCase().trim();
 const list=winesCache.filter(w=>[w.name,w.producer,w.country,w.barcode,w.location,w.type,w.year,w.notes].join(" ").toLowerCase().includes(term));
 if(!list.length){box.innerHTML='<div class="empty">Ingen vine fundet.</div>';return}
 box.innerHTML=list.map(w=>`
  <div class="result">
   <div class="resultTitle">${esc(w.name||"Ukendt vin")}</div>
   <div class="resultMeta">${esc(w.producer||"")}${w.year?" · "+esc(w.year):""}${w.type?" · "+esc(w.type):""}</div>
   <div class="resultMeta">Antal: <b>${Number(w.quantity)||0}</b>${w.country?" · "+esc(w.country):""}${w.location?" · "+esc(w.location):""}</div>
   ${w.barcode?'<div class="resultMeta">EAN: '+esc(w.barcode)+'</div>':""}
  </div>`).join("");
}

async function showCategory(type){
 await showSearch();
 document.getElementById("searchInput").value=type;
 renderSearchResults();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

/* ================= NAVIGATION ================= */
function showOnly(id){
 ["homePage","scannerPage","scanResult","addPage","searchPage"].forEach(x=>document.getElementById(x).style.display=x===id?"block":"none");
}
