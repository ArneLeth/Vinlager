<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Vinlager">

<title>Mit Vinlager</title>


<!-- Quagga2 - stregkodescanner -->

<script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>


<style>

/* =====================================================
   GENERELT
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f7f5f2;

    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {

    max-width: 600px;

    margin: auto;

    padding: 20px;
}

h1 {

    text-align: center;

    margin:
        10px 0 5px;

    font-size: 30px;
}

h2 {

    margin-top: 5px;
}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;
}


/* =====================================================
   KNAPPER
===================================================== */

button {

    width: 100%;

    border: none;

    border-radius: 14px;

    padding: 17px;

    margin: 7px 0;

    font-size: 17px;

    font-weight: 600;

    background: white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);
}

.scan {

    font-size: 20px;

    padding: 22px;

    background: #222;

    color: white;
}

.category {

    text-align: left;

    font-weight: 500;
}

.count {

    float: right;

    color: #888;
}

.save {

    background: #222;

    color: white;
}

.back {

    background: #ddd;

    color: #222;
}


/* =====================================================
   SIDER
===================================================== */

#homePage {

    display: block;
}

#scannerPage {

    display: none;
}

#addPage {

    display: none;
}


/* =====================================================
   SCANNER
===================================================== */

#camera {

    position: relative;

    width: 100%;

    overflow: hidden;

    border-radius: 16px;

    background: black;
}

#camera video {

    width: 100%;

    height: auto;

    display: block;
}

#camera canvas.drawingBuffer {

    position: absolute;

    top: 0;

    left: 0;
}

.scanbox {

    position: absolute;

    top: 35%;

    left: 5%;

    width: 90%;

    height: 30%;

    border:
        3px solid white;

    border-radius: 8px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);
}

.scanline {

    position: absolute;

    top: 50%;

    left: 5%;

    width: 90%;

    height: 2px;

    background: red;

    pointer-events: none;
}

.scanner-info {

    text-align: center;

    margin:
        15px 0;

    color: #666;
}


/* =====================================================
   SCAN RESULTAT
===================================================== */

#scanResult {

    display: none;

    margin-top: 15px;

    padding: 15px;

    background: white;

    border-radius: 14px;

    text-align: center;
}

.barcode {

    font-size: 20px;

    font-weight: bold;

    margin:
        10px 0;

    letter-spacing: 1px;
}


/* =====================================================
   FORMULAR
===================================================== */

.form input,
.form select,
.form textarea {

    width: 100%;

    padding: 14px;

    margin:
        6px 0 14px;

    border:
        1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    background: white;
}

.form label {

    font-weight: 600;
}


/* =====================================================
   FOTO
===================================================== */

.photo-section {

    margin-top: 10px;

    margin-bottom: 15px;
}

#photoPreview {

    width: 100%;

    max-height: 300px;

    object-fit: contain;

    border-radius: 12px;

    display: none;

    background: #eee;

    margin-top: 10px;
}


/* =====================================================
   STATUS
===================================================== */

.message {

    display: none;

    padding: 12px;

    margin:
        10px 0;

    border-radius: 10px;

    text-align: center;

    background: #e9e9e9;
}

</style>

</head>


<body>


<div class="app">


<!-- ===================================================
     FORSIDE
=================================================== -->

<div id="homePage">


    <h1>
        🍷 Mit Vinlager
    </h1>


    <div class="subtitle">
        Dit private vinlager
    </div>


    <button
        class="scan"
        onclick="startScanner()">

        📷 Scan vin

    </button>


    <button
        onclick="showAddForm('')">

        ➕ Tilføj vin

    </button>


    <button>

        🔎 Søg i vinlager

    </button>


    <br>


    <button class="category">

        🍷 Rødvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🥂 Hvidvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🫧 Mousserende

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🍾 Champagne

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🍷 Portvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🥃 Spiritus

        <span class="count">
            0
        </span>

    </button>


</div>


<!-- ===================================================
     SCANNER
=================================================== -->

<div id="scannerPage">


    <h2>
        📷 Scan vin
    </h2>


    <div class="scanner-info">

        Placer stregkoden
        inden for rammen

    </div>


    <div id="camera">

        <div class="scanbox"></div>

        <div class="scanline"></div>

    </div>


    <div
        id="scannerStatus"
        class="scanner-info">

        Starter kamera…

    </div>


    <button
        onclick="closeScanner()"
        class="back">

        ← Luk scanner

    </button>


</div>


<!-- ===================================================
     SCAN RESULTAT
=================================================== -->

<div id="scanResult">


    <div>
        Stregkode fundet
    </div>


    <div
        id="barcode"
        class="barcode">
    </div>


    <button
        onclick="continueWithBarcode()">

        ➕ Tilføj denne vin

    </button>


    <button
        onclick="scanAgain()"
        class="back">

        📷 Scan igen

    </button>


</div>


<!-- ===================================================
     TILFØJ VIN
=================================================== -->

<div
    id="addPage"
    class="form">


    <h2>
        ➕ Tilføj vin
    </h2>


    <label>
        Stregkode
    </label>

    <input
        id="wineBarcode"
        type="text"
        inputmode="numeric">


    <label>
        Navn
    </label>

    <input
        id="wineName"
        type="text"
        placeholder="Vinens navn">


    <label>
        Producent
    </label>

    <input
        id="wineProducer"
        type="text"
        placeholder="Producent">


    <label>
        Årgang
    </label>

    <input
        id="wineYear"
        type="number"
        placeholder="Fx 2020">


    <label>
        Type
    </label>

    <select id="wineType">

        <option value="Rødvin">
            🍷 Rødvin
        </option>

        <option value="Hvidvin">
            🥂 Hvidvin
        </option>

        <option value="Mousserende">
            🫧 Mousserende
        </option>

        <option value="Champagne">
            🍾 Champagne
        </option>

        <option value="Portvin">
            🍷 Portvin
        </option>

        <option value="Spiritus">
            🥃 Spiritus
        </option>

    </select>


    <label>
        Land
    </label>

    <input
        id="wineCountry"
        type="text"
        placeholder="Fx Italien">


    <label>
        Antal
    </label>

    <input
        id="wineQuantity"
        type="number"
        value="1"
        min="1">


    <label>
        Placering
    </label>

    <input
        id="wineLocation"
        type="text"
        placeholder="Fx Reol 2, hylde 3">


    <!-- FOTO -->

    <div class="photo-section">

        <label>
            📸 Billede af etiketten
        </label>


        <input
            id="winePhoto"
            type="file"
            accept="image/*"
            capture="environment"
            onchange="previewPhoto(event)">


        <img
            id="photoPreview">

    </div>


    <label>
        Noter
    </label>


    <textarea
        id="wineNotes"
        rows="4"
        placeholder="Dine egne noter">
    </textarea>


    <button
        class="save"
        onclick="saveWine()">

        💾 Gem vin

    </button>


    <button
        class="back"
        onclick="showHome()">

        ← Tilbage

    </button>


</div>


</div>


<script>


/* =====================================================
   SCANNER VARIABLER
===================================================== */

let scannerRunning = false;

let lastCode = "";

let detectionCount = 0;

const REQUIRED_DETECTIONS = 2;


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {


    document.getElementById(
        "homePage"
    ).style.display =
        "none";


    document.getElementById(
        "addPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    document.getElementById(
        "scannerPage"
    ).style.display =
        "block";


    lastCode = "";

    detectionCount = 0;


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "Starter kamera…";


    const config = {


        inputStream: {

            name:
                "Live",

            type:
                "LiveStream",

            target:
                document.querySelector(
                    "#camera"
                ),


            constraints: {

                width: {

                    min: 640,

                    ideal: 1920

                },

                height: {

                    min: 480,

                    ideal: 1080

                },

                facingMode: {

                    ideal:
                        "environment"

                },

                aspectRatio: {

                    ideal:
                        16 / 9

                },

                focusMode:
                    "continuous"

            },


            area: {

                top:
                    "25%",

                right:
                    "5%",

                left:
                    "5%",

                bottom:
                    "25%"

            }

        },


        locator: {

            patchSize:
                "medium",

            halfSample:
                true

        },


        frequency:
            15,


        decoder: {

            readers: [

                "ean_reader",

                "ean_8_reader"

            ]

        },


        locate:
            true,


        numOfWorkers:

            navigator.hardwareConcurrency

            ? Math.min(
                navigator.hardwareConcurrency,
                4
              )

            : 2

    };


    Quagga.init(

        config,

        function(error) {


            if (error) {

                console.error(error);


                document.getElementById(
                    "scannerStatus"
                ).textContent =
                    "Kameraet kunne ikke startes.";


                return;

            }


            Quagga.start();


            scannerRunning =
                true;


            document.getElementById(
                "scannerStatus"
            ).textContent =
                "Scanner…";


            Quagga.onDetected(
                barcodeDetected
            );

        }

    );

}


/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(result) {


    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {

        return;

    }


    if (
        code === lastCode
    ) {

        detectionCount++;

    }

    else {

        lastCode =
            code;

        detectionCount =
            1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(code);

    }

}


/* =====================================================
   AFSLUT SCANNING
===================================================== */

function finishScan(code) {


    stopScanner();


    document.getElementById(
        "barcode"
    ).textContent =
        code;


    document.getElementById(
        "scannerPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"
    ).style.display =
        "block";

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {


    if (!scannerRunning) {

        return;

    }


    try {

        Quagga.offDetected(
            barcodeDetected
        );


        Quagga.stop();

    }

    catch (error) {

        console.log(error);

    }


    scannerRunning =
        false;

}


/* =====================================================
   LUK SCANNER
===================================================== */

function closeScanner() {


    stopScanner();


    document.getElementById(
        "scannerPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    document.getElementById(
        "homePage"
    ).style.display =
        "block";

}


/* =====================================================
   SCAN IGEN
===================================================== */

function scanAgain() {


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    startScanner();

}


/* =====================================================
   FORTSÆT MED STREGKODE
===================================================== */

function continueWithBarcode() {


    const code =
        document.getElementById(
            "barcode"
        ).textContent;


    showAddForm(code);

}


/* =====================================================
   RESET VINFORMULAR
===================================================== */

function resetWineForm() {


    document.getElementById(
        "wineBarcode"
    ).value =
        "";


    document.getElementById(
        "wineName"
    ).value =
        "";


    document.getElementById(
        "wineProducer"
    ).value =
        "";


    document.getElementById(
        "wineYear"
    ).value =
        "";


    document.getElementById(
        "wineType"
    ).value =
        "Rødvin";


    document.getElementById(
        "wineCountry"
    ).value =
        "";


    document.getElementById(
        "wineQuantity"
    ).value =
        "1";


    document.getElementById(
        "wineLocation"
    ).value =
        "";


    document.getElementById(
        "wineNotes"
    ).value =
        "";


    document.getElementById(
        "winePhoto"
    ).value =
        "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    preview.src =
        "";


    preview.style.display =
        "none";

}


/* =====================================================
   VIS TILFØJ VIN
===================================================== */

function showAddForm(code) {


    resetWineForm();


    document.getElementById(
        "homePage"
    ).style.display =
        "none";


    document.getElementById(
        "scannerPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    document.getElementById(
        "addPage"
    ).style.display =
        "block";


    document.getElementById(
        "wineBarcode"
    ).value =
        code || "";

}


/* =====================================================
   FOTO PREVIEW
===================================================== */

function previewPhoto(event) {


    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const image =
        document.getElementById(
            "photoPreview"
        );


    image.src =
        URL.createObjectURL(
            file
        );


    image.style.display =
        "block";

}


/* =====================================================
   GEM VIN
===================================================== */

function saveWine() {


    const wine = {


        barcode:
            document.getElementById(
                "wineBarcode"
            ).value,


        name:
            document.getElementById(
                "wineName"
            ).value,


        producer:
            document.getElementById(
                "wineProducer"
            ).value,


        year:
            document.getElementById(
                "wineYear"
            ).value,


        type:
            document.getElementById(
                "wineType"
            ).value,


        country:
            document.getElementById(
                "wineCountry"
            ).value,


        quantity:
            document.getElementById(
                "wineQuantity"
            ).value,


        location:
            document.getElementById(
                "wineLocation"
            ).value,


        notes:
            document.getElementById(
                "wineNotes"
            ).value

    };


    /*
       Midlertidig testlagring.
       Denne erstattes senere
       med OneDrive.
    */

    localStorage.setItem(
        "testWine",
        JSON.stringify(
            wine
        )
    );


    alert(
        "Vinen er gemt midlertidigt."
    );


    /*
       Nulstil alt efter gemning.
    */

    resetWineForm();


    showHome();

}


/* =====================================================
   TILBAGE TIL FORSIDE
===================================================== */

function showHome() {


    stopScanner();


    document.getElementById(
        "homePage"
    ).style.display =
        "block";


    document.getElementById(
        "scannerPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    document.getElementById(
        "addPage"
    ).style.display =
        "none";


    /*
       Sørg for at næste
       "Tilføj vin" starter rent.
    */

    resetWineForm();

}

</script>

</body>

</html>
