<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vinlager">

<title>Mit Vinlager</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f5f2;
    color: #222;
}

.app {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin: 7px 0;
    font-size: 17px;
    font-weight: 600;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.scan {
    font-size: 20px;
    padding: 22px;
    background: #222;
    color: white;
}

.category {
    text-align: left;
    font-weight: 500;
}

.count {
    float: right;
    color: #888;
}

#scanner {
    display: none;
    margin-top: 20px;
    background: white;
    border-radius: 16px;
    padding: 10px;
    overflow: hidden;
}

#result {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 14px;
    text-align: center;
}

.barcode {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}
</style>
</head>

<body>

<div class="app">

    <h1>🍷 Mit Vinlager</h1>

    <div class="subtitle">
        Dit private vinlager
    </div>

    <button class="scan" onclick="startScanner()">
        📷 Scan vin
    </button>

    <div id="scanner"></div>

    <div id="result">
        <div>Stregkode fundet</div>
        <div class="barcode" id="barcode"></div>

        <button onclick="stopScanner()">
            Luk scanner
        </button>
    </div>

    <button>
        ➕ Tilføj vin
    </button>

    <button>
        🔎 Søg i vinlager
    </button>

    <br>

    <button class="category">
        🍷 Rødvin
        <span class="count">0</span>
    </button>

    <button class="category">
        🥂 Hvidvin
        <span class="count">0</span>
    </button>

    <button class="category">
        🫧 Mousserende
        <span class="count">0</span>
    </button>

    <button class="category">
        🍾 Champagne
        <span class="count">0</span>
    </button>

    <button class="category">
        🍷 Portvin
        <span class="count">0</span>
    </button>

    <button class="category">
        🥃 Spiritus
        <span class="count">0</span>
    </button>

</div>

<script>

let scanner;

function startScanner() {

    document.getElementById("scanner").style.display = "block";
    document.getElementById("result").style.display = "none";

    scanner = new Html5Qrcode("scanner");

    scanner.start(
        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: {
                width: 280,
                height: 120
            }
        },

        function(decodedText) {

            document.getElementById("barcode").textContent = decodedText;
            document.getElementById("result").style.display = "block";

            scanner.stop().then(function() {
                document.getElementById("scanner").style.display = "none";
            });

        },

        function(errorMessage) {
            // Ingen handling nødvendig.
        }

    ).catch(function(error) {

        alert(
            "Kunne ikke åbne kameraet.\n\n" +
            "Kontroller at browseren har adgang til kameraet."
        );

    });
}

function stopScanner() {

    if (scanner) {

        scanner.stop().then(function() {

            document.getElementById("scanner").style.display = "none";
            document.getElementById("result").style.display = "none";

        });

    }

}

</script>

</body>
</html>
