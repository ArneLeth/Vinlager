<script>


/* =====================================================
   GOOGLE DRIVE
===================================================== */

const GOOGLE_CLIENT_ID =
"701927788585-hfkv438gs0ljn6ln9c05q6p9lsns9j6i.apps.googleusercontent.com";


const GOOGLE_SCOPE =
"https://www.googleapis.com/auth/drive.file";


let googleTokenClient = null;

let googleAccessToken = null;


/*
   Vi gemmer både mappe-ID og wines.json-ID.

   Det betyder at appen normalt ikke behøver
   at søge efter dem på Google Drive igen.
*/

let googleFolderId =
    localStorage.getItem(
        "vinlagerGoogleFolderId"
    );


let googleWinesFileId =
    localStorage.getItem(
        "vinlagerGoogleWinesFileId"
    );


/* =====================================================
   GOOGLE LOGIN
===================================================== */

function loginGoogle() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        alert(
            "Google-login er ikke indlæst endnu. " +
            "Prøv igen om et øjeblik."
        );

        return;

    }


    googleTokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                GOOGLE_CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                async function(response) {

                    if (
                        response.error
                    ) {

                        console.error(
                            "Google login fejl:",
                            response
                        );


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "❌ Google-login fejlede.";

                        return;

                    }


                    googleAccessToken =
                        response.access_token;


                    document.getElementById(
                        "googleStatus"
                    ).textContent =
                        "✅ Forbundet til Google Drive";


                    document.getElementById(
                        "googleLoginButton"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "googleLogoutButton"
                    ).style.display =
                        "block";


                    try {

                        await getOrCreateWineFolder();


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "✅ Google Drive klar – Mit Vinlager";

                    }

                    catch (error) {

                        console.error(
                            error
                        );


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "⚠️ Google er logget ind, "
                            + "men Drive kunne ikke åbnes.";

                    }

                }

        });


    googleTokenClient.requestAccessToken({
        prompt: "consent"
    });

}


/* =====================================================
   GOOGLE LOGOUT
===================================================== */

function logoutGoogle() {

    if (
        googleAccessToken &&
        window.google
    ) {

        google.accounts.oauth2.revoke(
            googleAccessToken
        );

    }


    googleAccessToken =
        null;


    document.getElementById(
        "googleStatus"
    ).textContent =
        "☁️ Ikke forbundet til Google Drive";


    document.getElementById(
        "googleLoginButton"
    ).style.display =
        "block";


    document.getElementById(
        "googleLogoutButton"
    ).style.display =
        "none";

}


/* =====================================================
   GOOGLE DRIVE REQUEST
===================================================== */

async function driveRequest(
    url,
    options = {}
) {

    if (
        !googleAccessToken
    ) {

        throw new Error(
            "Ikke logget ind på Google Drive."
        );

    }


    const headers =
        options.headers || {};


    headers.Authorization =
        "Bearer "
        + googleAccessToken;


    options.headers =
        headers;


    const response =
        await fetch(
            url,
            options
        );


    if (
        !response.ok
    ) {

        let errorText =
            "";


        try {

            const errorData =
                await response.json();


            errorText =
                errorData.error?.message
                ||
                JSON.stringify(
                    errorData
                );

        }

        catch {

            errorText =
                await response.text();

        }


        throw new Error(
            errorText
        );

    }


    return response;

}


/* =====================================================
   FIND / OPRET VINLAGER-MAPPE
===================================================== */

async function getOrCreateWineFolder() {

    /*
       Hvis vi allerede kender mappen,
       bruger vi den direkte.
    */

    if (
        googleFolderId
    ) {

        return googleFolderId;

    }


    /*
       Første gang søger vi efter mappen.
    */

    const searchUrl =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            "name='Mit Vinlager'"
            + " and mimeType='application/vnd.google-apps.folder'"
            + " and trashed=false"
        )
        + "&spaces=drive"
        + "&fields=files(id,name)";


    const response =
        await driveRequest(
            searchUrl
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length > 0
    ) {

        googleFolderId =
            data.files[0].id;


        localStorage.setItem(
            "vinlagerGoogleFolderId",
            googleFolderId
        );


        return googleFolderId;

    }


    /*
       Opret mappen.
    */

    const createResponse =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            "Mit Vinlager",

                        mimeType:
                            "application/vnd.google-apps.folder"

                    })

            }
        );


    const folder =
        await createResponse.json();


    googleFolderId =
        folder.id;


    localStorage.setItem(
        "vinlagerGoogleFolderId",
        googleFolderId
    );


    return googleFolderId;

}


/* =====================================================
   FIND WINES.JSON
===================================================== */

async function findDriveFile(
    fileName
) {

    /*
       Hvis det er wines.json og vi allerede
       kender ID'et, så bruger vi det direkte.
    */

    if (
        fileName === "wines.json" &&
        googleWinesFileId
    ) {

        return {

            id:
                googleWinesFileId,

            name:
                "wines.json",

            mimeType:
                "application/json"

        };

    }


    const query =
        "name='"
        + fileName.replace(
            /'/g,
            "\\'"
        )
        + "'"
        + " and '"
        + googleFolderId
        + "' in parents"
        + " and trashed=false";


    const url =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            query
        )
        + "&spaces=drive"
        + "&fields=files(id,name,mimeType)";


    const response =
        await driveRequest(
            url
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length
    ) {

        const file =
            data.files[0];


        /*
           Gem ID'et hvis det er wines.json.
        */

        if (
            fileName === "wines.json"
        ) {

            googleWinesFileId =
                file.id;


            localStorage.setItem(
                "vinlagerGoogleWinesFileId",
                googleWinesFileId
            );

        }


        return file;

    }


    return null;

}


/* =====================================================
   HENT WINES.JSON
===================================================== */

async function loadWinesFromDrive() {

    const file =
        await findDriveFile(
            "wines.json"
        );


    if (!file) {

        return [];

    }


    try {

        const response =
            await driveRequest(
                "https://www.googleapis.com/drive/v3/files/"
                + file.id
                + "?alt=media"
            );


        const text =
            await response.text();


        const wines =
            JSON.parse(
                text
            );


        return Array.isArray(wines)
            ? wines
            : [];

    }

    catch (error) {

        /*
           Hvis filen er slettet eller ID'et
           ikke længere virker, nulstiller vi
           det gemte ID og prøver igen.
        */

        if (
            error.message &&
            (
                error.message.includes("File not found")
                ||
                error.message.includes("not found")
            )
        ) {

            googleWinesFileId =
                null;


            localStorage.removeItem(
                "vinlagerGoogleWinesFileId"
            );

        }


        throw error;

    }

}


/* =====================================================
   GEM WINES.JSON
===================================================== */

async function saveWinesToDrive(
    wines
) {

    const json =
        JSON.stringify(
            wines,
            null,
            2
        );


    const existingFile =
        await findDriveFile(
            "wines.json"
        );


    /*
       Hvis filen allerede findes,
       opdaterer vi kun den eksisterende fil.

       Hvis den ikke findes, oprettes den.
    */

    if (
        existingFile
    ) {

        const url =
            "https://www.googleapis.com/upload/drive/v3/files/"
            + existingFile.id
            + "?uploadType=media";


        await driveRequest(
            url,
            {

                method:
                    "PATCH",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    json

            }
        );


        return;

    }


    /*
       Opret wines.json første gang.
    */

    const metadata = {

        name:
            "wines.json",

        mimeType:
            "application/json",

        parents:
            [googleFolderId]

    };


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--"
        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const body =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(
            metadata
        )
        + delimiter
        + "Content-Type: application/json\r\n\r\n"
        + json
        + closeDelimiter;


    const response =
        await driveRequest(
            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "multipart/related; boundary="
                        + boundary

                },

                body:
                    body

            }
        );


    const data =
        await response.json();


    /*
       Gem ID'et så fremtidige gemninger
       ikke behøver at søge efter filen.
    */

    googleWinesFileId =
        data.id;


    localStorage.setItem(
        "vinlagerGoogleWinesFileId",
        googleWinesFileId
    );

}


/* =====================================================
   KOMPRIMER BILLEDE
===================================================== */

function compressImage(
    file
) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const image =
                        new Image();


                    image.onload =
                        function() {

                            const MAX_WIDTH =
                                1200;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                MAX_WIDTH
                            ) {

                                height =
                                    height
                                    *
                                    MAX_WIDTH
                                    /
                                    width;

                                width =
                                    MAX_WIDTH;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(

                                function(blob) {

                                    if (
                                        !blob
                                    ) {

                                        reject(
                                            new Error(
                                                "Kunne ikke komprimere billedet."
                                            )
                                        );

                                        return;

                                    }


                                    resolve(
                                        blob
                                    );

                                },

                                "image/jpeg",

                                0.78

                            );

                        };


                    image.onerror =
                        reject;


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

        "-------314159265358979323846";


    const delimiter =

        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const metadataPart =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(
            metadata
        );


    const imagePart =
        delimiter
        + "Content-Type: image/jpeg\r\n\r\n";


    const body =
        new Blob(
            [

                metadataPart,

                imagePart,

                compressed,

                closeDelimiter

            ],

            {
                type:
                    "multipart/related; boundary="
                    + boundary
            }
        );


    const response =
        await driveRequest(
            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "multipart/related; boundary="
                        + boundary

                },

                body:
                    body

            }
        );


    const data =
        await response.json();


    return data.id;

}

let scannerRunning = false;

/* =====================================================

function startScanner() {

    document.getElementById(
        "homePage"
    ).style.display =

        "addPage"
    ).style.display =
        "none";


    document.getElementById(
        "scanResult"

    ).style.display =
        "block";


    lastCode = "";

    detectionCount = 0;


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "Starter kamera…";


    const config = {

        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.querySelector(
                    "#camera"
                ),

            constraints: {

                width: {
                    min: 640,
                    ideal: 1920
                },

                height: {
                    min: 480,
                    ideal: 1080
                },

                facingMode: {
                    ideal: "environment"
                },

                aspectRatio: {
                    ideal: 16 / 9
                },

                focusMode:
                    "continuous"

            },

            area: {

                top: "25%",

                right: "5%",

                left: "5%",

                bottom: "25%"

            }

        },

        locator: {

            patchSize: "medium",

            halfSample: true

        },

        frequency: 15,

        decoder: {

            readers: [
                "ean_reader",
                "ean_8_reader"
            ]

        },

        locate: true,

        numOfWorkers:
            navigator.hardwareConcurrency
            ? Math.min(
                navigator.hardwareConcurrency,
                4
              )
            : 2

    };


    Quagga.init(

        config,

        function(error) {

            if (error) {

                console.error(error);


                document.getElementById(
                    "scannerStatus"
                ).textContent =
                    "Kameraet kunne ikke startes.";


                return;

            }


            Quagga.start();


            scannerRunning =
                true;


            document.getElementById(
                "scannerStatus"
            ).textContent =
                "Scanner…";


            Quagga.onDetected(
                barcodeDetected
            );

        }

    );

}


/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(
    result
) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {

        return;

    }


    if (
        code === lastCode
    ) {

        detectionCount++;

    }

    else {

        lastCode =
            code;

        detectionCount =
            1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(
            code
        );

    }

}

    try {

        Quagga.stop();

/* =====================================================

===================================================== */

async function lookupWine(
    code
) {

    const status =
        document.getElementById(
            "lookupStatus"
        );


    status.className =
        "lookupStatus";


    status.textContent =
        "🔎 Søger efter vin...";


    const fields = [

        "code",
        "product_name",
        "product_name_da",
        "generic_name",
        "generic_name_da",
        "brands",
        "categories",
        "categories_tags",
        "countries",
        "countries_tags",
        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/"
        + encodeURIComponent(
            code
        )
        + "?product_type=all"
        + "&lc=da"
        + "&cc=dk"
        + "&fields="
        + encodeURIComponent(
            fields
        );


    try {

        const response =
            await fetch(
                url,
                {
                    method:
                        "GET"
                }
            );


        if (
            !response.ok
        ) {

            if (
                response.status === 404
            ) {

                lookupWineData =
                    null;


                status.className =
                    "lookupStatus lookupWarning";


                status.textContent =
                    "⚠️ Stregkoden findes ikke "
                    + "i databasen. Du kan indtaste "
                    + "vinen manuelt.";


                return;

            }


            throw new Error(
                "HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        const product =
            data.product;


        if (
            !product
        ) {

            lookupWineData =
                null;


            status.className =
                "lookupStatus lookupWarning";


            status.textContent =
                "⚠️ Vinen blev ikke fundet "
                + "i databasen.";


            return;

        }


        const name =

            product.product_name_da
            ||
            product.product_name
            ||
            product.generic_name_da
            ||
            product.generic_name
            ||
            "";


        const producer =
            product.brands
            ||
            "";


        const country =
            extractCountry(
                product
            );


        const type =
            detectWineType(
                product
            );


        lookupWineData = {

            name:
                name,

            producer:
                producer,

            country:
                country,

            type:
                type

        };


        status.className =
            "lookupStatus lookupSuccess";


        if (
            name
        ) {

            status.textContent =
                "✅ Vin fundet: "
                + name
                + ". Kontrollér oplysningerne "
                + "før du gemmer.";

        }

        else {

            status.textContent =
                "✅ Stregkoden blev fundet, "
                + "men der mangler vinoplysninger. "
                + "Kontrollér formularen.";

        }


    }

    catch (
        error
    ) {

        console.error(
            "Vinopslag fejlede:",
            error
        );


        lookupWineData =
            null;


        status.className =
            "lookupStatus lookupError";


        status.textContent =
            "⚠️ Kunne ikke kontakte "
            + "vin-databasen. "
            + "Du kan stadig indtaste "
            + "vinen manuelt.";

    }

}


/* =====================================================
   FIND LAND
===================================================== */

function extractCountry(
    product
) {

    if (
        Array.isArray(
            product.countries_tags
        )
        &&
        product.countries_tags.length
    ) {

        const country =
            product.countries_tags[0];


        return cleanTaxonomyValue(
            country
        );

    }


    if (
        product.countries
    ) {

        return product.countries
            .split(",")[0]
            .trim();

    }


    if (
        product.origins
    ) {

        return product.origins
            .split(",")[0]
            .trim();

    }


    return "";

}


/* =====================================================
   RENS TAXONOMI
===================================================== */

function cleanTaxonomyValue(
    value
) {

    if (
        !value
    ) {

        return "";

    }


    const parts =
        value.split(":");


    if (
        parts.length > 1
    ) {

        return parts
            .slice(1)
            .join(":")
            .replace(
                /-/g,
                " "
            );

    }


    return value
        .replace(
            /-/g,
            " "
        );

}


/* =====================================================
   GENKENDEL VINTYPE
===================================================== */

function detectWineType(
    product
) {

    const text = (

        (
            product.product_name
            ||
            ""
        )

        + " "

        +

        (
            product.product_name_da
            ||
            ""
        )

        + " "

        +

        (
            product.generic_name
            ||
            ""
        )

        + " "

        +

        (
            product.generic_name_da
            ||
            ""
        )

        + " "

        +

        (
            product.categories
            ||
            ""
        )

        + " "

        +

        (
            Array.isArray(
                product.categories_tags
            )
            ?
            product.categories_tags.join(
                " "
            )
            :
            ""
        )

    ).toLowerCase();


    /*
       Champagne skal genkendes først.
    */

    if (
        text.includes(
            "champagne"
        )
    ) {

        return "Champagne";

    }


    /*
       Portvin.
    */

    if (

        text.includes(
            "port wine"
        )
        ||
        text.includes(
            "portwine"
        )
        ||
        text.includes(
            "portvin"
        )
        ||
        text.includes(
            "porto"
        )

    ) {

        return "Portvin";

    }


    /*
       Spiritus.
    */

    if (

        text.includes(
            "spirit"
        )
        ||
        text.includes(
            "whisky"
        )
        ||
        text.includes(
            "whiskey"
        )
        ||
        text.includes(
            "vodka"
        )
        ||
        text.includes(
            "gin"
        )
        ||
        text.includes(
            "rum"
        )
        ||
        text.includes(
            "brandy"
        )
        ||
        text.includes(
            "cognac"
        )
        ||
        text.includes(
            "liqueur"
        )
        ||
        text.includes(
            "likør"
        )

    ) {

        return "Spiritus";

    }


    /*
       ROSÉ
       Skal kontrolleres før rødvin.
    */

    if (

        text.includes(
            "rosé"
        )
        ||
        text.includes(
            "rose wine"
        )
        ||
        text.includes(
            "rosé wine"
        )
        ||
        text.includes(
            "rosévin"
        )
        ||
        text.includes(
            "rosevin"
        )
        ||
        text.includes(
            "vin rosé"
        )
        ||
        text.includes(
            "vin rose"
        )
        ||
        text.includes(
            "vino rosato"
        )
        ||
        text.includes(
            "rosato"
        )
        ||
        text.includes(
            "rosado"
        )
        ||
        text.includes(
            "rosado wine"
        )
        ||
        text.includes(
            "rosé wines"
        )

    ) {

        return "Rosévin";

    }


    /*
       Mousserende.
    */

    if (

        text.includes(
            "sparkling"
        )
        ||
        text.includes(
            "mousser"
        )
        ||
        text.includes(
            "prosecco"
        )
        ||
        text.includes(
            "cava"
        )
        ||
        text.includes(
            "crémant"
        )
        ||
        text.includes(
            "cremant"
        )
        ||
        text.includes(
            "sekt"
        )

    ) {

        return "Mousserende";

    }


    /*
       Hvidvin.
    */

    if (

        text.includes(
            "white wine"
        )
        ||
        text.includes(
            "white-wine"
        )
        ||
        text.includes(
            "hvidvin"
        )
        ||
        text.includes(
            "vino bianco"
        )
        ||
        text.includes(
            "vin blanc"
        )
        ||
        text.includes(
            "weisswein"
        )
        ||
        text.includes(
            "weißwein"
        )

    ) {

        return "Hvidvin";

    }


    /*
       Rødvin.
    */

    if (

        text.includes(
            "red wine"
        )
        ||
        text.includes(
            "red-wine"
        )
        ||
        text.includes(
            "rødvin"
        )
        ||
        text.includes(
            "vino rosso"
        )
        ||
        text.includes(
            "vin rouge"
        )
        ||
        text.includes(
            "rotwein"
        )

    ) {

        return "Rødvin";

    }


    /*
       Standard hvis databasen ikke
       fortæller os nok.
    */

    return "Rødvin";

}
