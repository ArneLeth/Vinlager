<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mit Vinlager</title>

<script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>


<style>

/* =====================================================
   GENERELT
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f5f2;
    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 30px;
}

h2 {
    margin-top: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}


/* =====================================================
   KNAPPER
===================================================== */

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin: 7px 0;
    font-size: 17px;
    font-weight: 600;
    background: white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);
}

.scan {
    font-size: 20px;
    padding: 22px;
    background: #222;
    color: white;
}

.category {
    text-align: left;
    font-weight: 500;
}

.count {
    float: right;
    color: #888;
}

.save {
    background: #222;
    color: white;
}

.back {
    background: #ddd;
    color: #222;
}


/* =====================================================
   SIDER
===================================================== */

#homePage {
    display: block;
}

#scannerPage {
    display: none;
}

#addPage {
    display: none;
}

#scanResult {
    display: none;
}


/* =====================================================
   SCANNER
===================================================== */

#camera {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 16px;
    background: black;
}

#camera video {
    width: 100%;
    height: auto;
    display: block;
}

#camera canvas.drawingBuffer {
    position: absolute;
    top: 0;
    left: 0;
}

.scanbox {
    position: absolute;

    top: 35%;
    left: 5%;

    width: 90%;
    height: 30%;

    border:
        3px solid white;

    border-radius: 8px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.20);
}

.scanline {
    position: absolute;

    top: 50%;
    left: 5%;

    width: 90%;
    height: 2px;

    background: red;

    pointer-events: none;
}

.scanner-info {
    text-align: center;
    margin: 15px 0;
    color: #666;
}


/* =====================================================
   SCAN RESULTAT
===================================================== */

#scanResult {
    margin-top: 15px;

    padding: 20px;

    background: white;

    border-radius: 14px;

    text-align: center;
}

.barcode {
    font-size: 21px;
    font-weight: bold;

    margin: 12px 0;

    letter-spacing: 1px;
}


/* =====================================================
   OPSLAGSSTATUS
===================================================== */

.lookupStatus {
    padding: 14px;
    margin: 12px 0;

    border-radius: 12px;

    text-align: center;

    background: #f1f1f1;

    color: #555;

    font-size: 15px;
}

.lookupSuccess {
    background: #e8f5e9;
    color: #216b2a;
}

.lookupWarning {
    background: #fff3cd;
    color: #745b00;
}


/* =====================================================
   FORMULAR
===================================================== */

.form input,
.form select,
.form textarea {

    width: 100%;

    padding: 14px;

    margin: 6px 0 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    background: white;
}

.form label {
    font-weight: 600;
}


/* =====================================================
   FOTO
===================================================== */

.photo-section {
    margin-top: 10px;
    margin-bottom: 15px;
}

#photoPreview {

    width: 100%;

    max-height: 300px;

    object-fit: contain;

    border-radius: 12px;

    display: none;

    background: #eee;

    margin-top: 10px;
}


/* =====================================================
   RESPONSIVT
===================================================== */

@media (max-width: 400px) {

    .app {
        padding: 15px;
    }

    h1 {
        font-size: 26px;
    }

    button {
        padding: 15px;
    }

}

</style>

</head>


<body>


<div class="app">


<!-- ===================================================
     FORSIDE
=================================================== -->

<div id="homePage">

    <h1>
        🍷 Mit Vinlager
    </h1>

    <div class="subtitle">
        Dit private vinlager
    </div>


    <button
        class="scan"
        onclick="startScanner()">

        📷 Scan vin

    </button>


    <button
        onclick="showAddForm('')">

        ➕ Tilføj vin

    </button>


    <button>

        🔎 Søg i vinlager

    </button>


    <br>


    <button class="category">

        🍷 Rødvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🥂 Hvidvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🫧 Mousserende

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🍾 Champagne

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🍷 Portvin

        <span class="count">
            0
        </span>

    </button>


    <button class="category">

        🥃 Spiritus

        <span class="count">
            0
        </span>

    </button>

</div>


<!-- ===================================================
     SCANNER
=================================================== -->

<div id="scannerPage">

    <h2>
        📷 Scan vin
    </h2>


    <div class="scanner-info">

        Placer stregkoden
        inden for rammen

    </div>


    <div id="camera">

        ← Luk scanner

    </button>

</div>


<!-- ===================================================

=================================================== -->

<div id="scanResult">

    <div

    <div

<!-- ===================================================
     TILFØJ VIN
=================================================== -->

<div
    id="addPage"
    class="form">


    <h2>
        ➕ Tilføj vin
    </h2>


    <div
        id="formLookupStatus"
        class="lookupStatus"
        style="display:none;">
    </div>


    <label>
        Stregkode
    </label>

    <input
        id="wineBarcode"
        type="text"
        inputmode="numeric">


    <label>
        Navn
    </label>

    <input
        id="wineName"
        type="text"
        placeholder="Vinens navn">


    <label>
        Producent
    </label>

    <input
        id="wineProducer"
        type="text"
        placeholder="Producent">


    <label>
        Årgang
    </label>

    <input
        id="wineYear"
        type="number"
        placeholder="Fx 2020">


    <label>
        Type
    </label>

    <select id="wineType">

        <option value="Rødvin">
            🍷 Rødvin
        </option>

        <option value="Hvidvin">
            🥂 Hvidvin
        </option>

        <option value="Mousserende">
            🫧 Mousserende
        </option>

        <option value="Champagne">
            🍾 Champagne
        </option>

        <option value="Portvin">
            🍷 Portvin
        </option>

        <option value="Spiritus">

        </option>

        Antal

        type="number"
        value="1"
        min="1">

        Placering
    </label>

    <input
        id="wineLocation"
        type="text"

    <div class="photo-section">

            📸 Billede af etiketten
        </label>


        <input
            id="winePhoto"
            type="file"
            accept="image/*"
            capture="environment"
            onchange="previewPhoto(event)">


        <img
            id="photoPreview">

    </div>


    <label>
        Noter
    </label>


    <textarea
        id="wineNotes"
        rows="4"
        placeholder="Dine egne noter">
    </textarea>


    <button
        class="save"
        onclick="saveWine()">

        💾 Gem vin

    </button>


    <button
        class="back"
        onclick="showHome()">

        ← Tilbage

    </button>

</div>


</div>


<script>


/* =====================================================
   SCANNER VARIABLER
===================================================== */

let scannerRunning = false;

let lastCode = "";

let detectionCount = 0;

const REQUIRED_DETECTIONS = 2;


/* =====================================================
   VIN DATA FRA OPSLAG
===================================================== */

let lookupWineData = null;


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

    document.getElementById(
        "homePage"
    ).style.display = "none";


    document.getElementById(
        "addPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "scannerPage"
    ).style.display = "block";


    lastCode = "";

    detectionCount = 0;


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "Starter kamera…";


    const config = {

        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.querySelector(
                    "#camera"
                ),


            constraints: {

                width: {
                    min: 640,
                    ideal: 1920
                },

                height: {
                    min: 480,
                    ideal: 1080
                },

                facingMode: {
                    ideal: "environment"
                },

                aspectRatio: {
                    ideal: 16 / 9
                },

                focusMode:
                    "continuous"

            },


            area: {

                top: "25%",

                right: "5%",

                left: "5%",

                bottom: "25%"

            }

        },


        locator: {

            patchSize: "medium",

            halfSample: true

        },


        frequency: 15,


        decoder: {

            readers: [

                "ean_reader",

                "ean_8_reader"

            ]

        },


        locate: true,


        numOfWorkers:

            navigator.hardwareConcurrency
            ? Math.min(
                navigator.hardwareConcurrency,
                4
              )
            : 2

    };


    Quagga.init(

        config,

        function(error) {

            if (error) {

                console.error(error);

                document.getElementById(
                    "scannerStatus"
                ).textContent =
                    "Kameraet kunne ikke startes.";

                return;

            }


            Quagga.start();

            scannerRunning = true;


            document.getElementById(
                "scannerStatus"
            ).textContent =
                "Scanner…";


            Quagga.onDetected(
                barcodeDetected
            );

        }

    );

}


/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(result) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {

        return;

    }


    if (code === lastCode) {

        detectionCount++;

    }

    else {

        lastCode = code;

        detectionCount = 1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(code);

    }

}


/* =====================================================
   AFSLUT SCANNING
===================================================== */

function finishScan(code) {

    stopScanner();


    lookupWineData = null;


    document.getElementById(
        "barcode"
    ).textContent = code;


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "block";


    lookupWine(code);

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

    if (!scannerRunning) {
        return;
    }


    try {

        Quagga.offDetected(
            barcodeDetected
        );

        Quagga.stop();

    }

    catch (error) {

        console.log(error);

    }


    scannerRunning = false;

}


/* =====================================================
   LUK SCANNER
===================================================== */

function closeScanner() {

    stopScanner();


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "homePage"
    ).style.display = "block";

}


/* =====================================================
   SCAN IGEN
===================================================== */

function scanAgain() {

    lookupWineData = null;


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    startScanner();

}


/* =====================================================
   OPEN FOOD FACTS OPSLAG
===================================================== */

async function lookupWine(code) {

    const status =
        document.getElementById(
            "lookupStatus"
        );


    status.className =
        "lookupStatus";


    status.textContent =
        "🔎 Søger efter vin...";


    /*
       Open Food Facts v3

       Vi henter kun de oplysninger,
       vi har brug for.
    */

    const fields = [

        "code",
        "product_name",
        "product_name_da",
        "generic_name",
        "generic_name_da",
        "brands",
        "categories",
        "categories_tags",
        "countries",
        "countries_tags",
        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/"
        + encodeURIComponent(code)
        + "?product_type=all"
        + "&lc=da"
        + "&cc=dk"
        + "&fields="
        + encodeURIComponent(fields);


    try {

        const response =
            await fetch(url);


        /*
           HTTP-fejl
        */

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
           Produkt ikke fundet
        */

        if (
            data.status !== 1 ||
            !data.product
        ) {

            lookupWineData = null;


            status.className =
                "lookupStatus lookupWarning";


            status.textContent =
                "⚠️ Vinen blev ikke fundet "
                + "automatisk. "
                + "Du kan indtaste oplysningerne "
                + "manuelt.";

            return;

        }


        const product =
            data.product;


        /*
           Navn
        */

        const name =

            product.product_name_da
            ||
            product.product_name
            ||
            product.generic_name_da
            ||
            product.generic_name
            ||
            "";


        /*
           Producent
        */

        const producer =
            product.brands || "";


        /*
           Land
        */

        const country =
            extractCountry(product);


        /*
           Type
        */

        const type =
            detectWineType(product);


        lookupWineData = {

            name:
                name,

            producer:
                producer,

            country:
                country,

            type:
                type

        };


        /*
           Vis resultat
        */

        status.className =
            "lookupStatus lookupSuccess";


        if (name) {

            status.textContent =
                "✅ Vin fundet automatisk. "
                + "Kontrollér oplysningerne "
                + "før du gemmer.";

        }

        else {

            status.textContent =
                "✅ Stregkoden blev fundet, "
                + "men der mangler oplysninger. "
                + "Kontrollér formularen.";

        }

    }

    catch (error) {

        console.error(
            "Open Food Facts fejl:",
            error
        );


        lookupWineData = null;


        /*
           Vi viser ikke en teknisk fejl
           til brugeren.

           Brugeren kan stadig
           indtaste vinen.
        */

        status.className =
            "lookupStatus lookupWarning";


        status.textContent =
            "⚠️ Der blev ikke fundet "
            + "automatiske oplysninger. "
            + "Indtast vinen manuelt.";

    }

}


/* =====================================================
   FIND LAND
===================================================== */

function extractCountry(product) {

    if (
        Array.isArray(
            product.countries_tags
        )
        &&
        product.countries_tags.length
    ) {

        return cleanTaxonomyValue(
            product.countries_tags[0]
        );

    }


    if (product.countries) {

        return product.countries
            .split(",")[0]
            .trim();

    }


    if (product.origins) {

        return product.origins
            .split(",")[0]
            .trim();

    }


    return "";

}


/* =====================================================
   RENS TAXONOMI
===================================================== */

function cleanTaxonomyValue(value) {

    if (!value) {
        return "";
    }


    const parts =
        value.split(":");


    if (parts.length > 1) {

        return parts
            .slice(1)
            .join(":")
            .replace(/-/g, " ");

    }


    return value
        .replace(/-/g, " ");

}


/* =====================================================
   GENKENDEL VINTYPE
===================================================== */

function detectWineType(product) {

    const text = (

        (
            product.product_name
            || ""
        )

        + " "

        +

        (
            product.product_name_da
            || ""
        )

        + " "

        +

        (
            product.generic_name
            || ""
        )

        + " "

        +

        (
            product.categories
            || ""
        )

        + " "

        +

        (
            Array.isArray(
                product.categories_tags
            )
            ?
            product.categories_tags.join(" ")
            :
            ""
        )

    ).toLowerCase();


    /*
       Champagne
    */

    if (
        text.includes("champagne")
    ) {

        return "Champagne";

    }


    /*
       Portvin
    */

    if (

        text.includes("port wine")
        ||
        text.includes("portwine")
        ||
        text.includes("portvin")
        ||
        text.includes("porto")

    ) {

        return "Portvin";

    }


    /*
       Mousserende
    */

    if (

        text.includes("sparkling")
        ||
        text.includes("mousser")
        ||
        text.includes("prosecco")
        ||
        text.includes("cava")
        ||
        text.includes("crémant")
        ||
        text.includes("cremant")
        ||
        text.includes("sekt")

    ) {

        return "Mousserende";

    }


    /*
       Spiritus
    */

    if (

        text.includes("spirit")
        ||
        text.includes("whisky")
        ||
        text.includes("whiskey")
        ||
        text.includes("vodka")
        ||
        text.includes("gin")
        ||
        text.includes("rum")
        ||
        text.includes("brandy")
        ||
        text.includes("cognac")
        ||
        text.includes("liqueur")
        ||
        text.includes("likør")
        ||
        text.includes("limoncello")

    ) {

        return "Spiritus";

    }


    /*
       Hvidvin
    */

    if (

        text.includes("white wine")
        ||
        text.includes("white-wine")
        ||
        text.includes("hvidvin")
        ||
        text.includes("vino bianco")
        ||
        text.includes("vin blanc")
        ||
        text.includes("weisswein")
        ||
        text.includes("weißwein")

    ) {

        return "Hvidvin";

    }


    /*
       Rødvin
    */

    if (

        text.includes("red wine")
        ||
        text.includes("red-wine")
        ||
        text.includes("rødvin")
        ||
        text.includes("vino rosso")
        ||
        text.includes("vin rouge")
        ||
        text.includes("rotwein")

    ) {

        return "Rødvin";

    }


    /*
       Standard
    */

    return "Rødvin";

}


/* =====================================================
   FORTSÆT MED STREGKODE
===================================================== */

function continueWithBarcode() {

    const code =
        document.getElementById(
            "barcode"
        ).textContent;


    showAddForm(
        code,
        lookupWineData
    );

}


/* =====================================================
   RESET FORMULAR
===================================================== */

function resetWineForm() {

    const form =
        document.getElementById(
            "addPage"
        );


    const inputs =
        form.querySelectorAll(
            "input"
        );


    inputs.forEach(
        function(input) {

            if (
                input.type === "file"
            ) {

                input.value = "";

            }

            else if (
                input.type === "number"
            ) {

                if (
                    input.id ===
                    "wineQuantity"
                ) {

                    input.value = "1";

                }

                else {

                    input.value = "";

                }

            }

            else {

                input.value = "";

            }

        }
    );


    document.getElementById(
        "wineType"
    ).selectedIndex = 0;


    document.getElementById(
        "wineNotes"
    ).value = "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    preview.removeAttribute(
        "src"
    );


    preview.style.display = "none";


    document.getElementById(
        "winePhoto"
    ).value = "";


    const status =
        document.getElementById(
            "formLookupStatus"
        );


    status.style.display = "none";

    status.textContent = "";

}


/* =====================================================
   VIS FORMULAR
===================================================== */

function showAddForm(
    code,
    wineData
) {

    document.getElementById(
        "homePage"
    ).style.display = "none";


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "addPage"
    ).style.display = "block";


    /*
       Vigtigt:
       reset før nye data indsættes.
    */

    resetWineForm();


    /*
       Stregkode
    */

    if (code) {

        document.getElementById(
            "wineBarcode"
        ).value = code;

    }


    /*
       Automatiske oplysninger
    */

    if (wineData) {

        document.getElementById(
            "wineName"
        ).value =
            wineData.name || "";


        document.getElementById(
            "wineProducer"
        ).value =
            wineData.producer || "";


        document.getElementById(
            "wineCountry"
        ).value =
            wineData.country || "";


        document.getElementById(
            "wineType"
        ).value =
            wineData.type || "Rødvin";


        const status =
            document.getElementById(
                "formLookupStatus"
            );


        status.style.display = "block";


        status.className =
            "lookupStatus lookupSuccess";


        status.textContent =
            "✅ Oplysninger hentet automatisk. "
            + "Kontrollér dem før du gemmer.";

    }

}


/* =====================================================
   FOTO PREVIEW
===================================================== */

function previewPhoto(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const image =
        document.getElementById(
            "photoPreview"
        );


    image.src =
        URL.createObjectURL(file);


    image.style.display =
        "block";

}


/* =====================================================
   GEM VIN
===================================================== */

function saveWine() {

    const wine = {

        barcode:
            document.getElementById(
                "wineBarcode"
            ).value,

        name:
            document.getElementById(
                "wineName"
            ).value,

        producer:
            document.getElementById(
                "wineProducer"
            ).value,

        year:
            document.getElementById(
                "wineYear"
            ).value,

        type:
            document.getElementById(
                "wineType"
            ).value,

        country:
            document.getElementById(
                "wineCountry"
            ).value,

        quantity:
            document.getElementById(
                "wineQuantity"
            ).value,

        location:
            document.getElementById(
                "wineLocation"
            ).value,

        notes:
            document.getElementById(
                "wineNotes"
            ).value

    };


    /*
       Midlertidig lokal testlagring.

       Denne del erstatter vi med
       OneDrive i næste trin.
    */

    localStorage.setItem(
        "testWine",
        JSON.stringify(wine)
    );


    alert(
        "Vinen er gemt midlertidigt."
    );


    /*
       Reset efter gemning
    */

    resetWineForm();


    showHome();

}


/* =====================================================

===================================================== */

function showHome() {

    stopScanner();


    document.getElementById(
        "homePage"
    ).style.display = "block";


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "addPage"
    ).style.display = "none";


    lookupWineData = null;

}
