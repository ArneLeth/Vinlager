<script>

/* =====================================================
   GOOGLE DRIVE
===================================================== */

const GOOGLE_CLIENT_ID =
"701927788585-hfkv438gs0ljn6ln9c05q6p9lsns9j6i.apps.googleusercontent.com";


const GOOGLE_SCOPE =
"https://www.googleapis.com/auth/drive.file";


let googleTokenClient = null;

let googleAccessToken = null;

let googleFolderId =
    localStorage.getItem(
        "vinlagerGoogleFolderId"
    );


/* =====================================================
   LAGERDATA
===================================================== */

/*
   Dette er vigtigt.

   wines.json bliver hentet én gang til denne variabel.

   Søgning, kategorier og lageroversigt bruger derefter
   denne variabel i stedet for at spørge Google Drive
   hver gang.
*/

let wines = [];


/*
   Hvilken vin redigerer vi?
*/

let editingWineId = null;


/*
   Aktuel kategori
*/

let currentCategory = null;


/* =====================================================
   HJÆLPEFUNKTIONER
===================================================== */

function getQuantity(wine) {

    const quantity =
        parseInt(
            wine.quantity,
            10
        );

    if (
        isNaN(quantity)
    ) {

        return 0;

    }

    return Math.max(
        0,
        quantity
    );

}


function totalBottleCount(list) {

    return list.reduce(
        function(total, wine) {

            return total +
                getQuantity(wine);

        },
        0
    );

}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

function loginGoogle() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        alert(
            "Google-login er ikke indlæst endnu. " +
            "Prøv igen om et øjeblik."
        );

        return;

    }


    googleTokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                GOOGLE_CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                async function(response) {

                    if (
                        response.error
                    ) {

                        console.error(
                            "Google login fejl:",
                            response
                        );


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "❌ Google-login fejlede.";

                        return;

                    }


                    googleAccessToken =
                        response.access_token;


                    document.getElementById(
                        "googleStatus"
                    ).textContent =
                        "☁️ Forbundet til Google Drive";


                    document.getElementById(
                        "googleLoginButton"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "googleLogoutButton"
                    ).style.display =
                        "block";


                    try {

                        await getOrCreateWineFolder();


                        await refreshWineInventory();


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "✅ Google Drive klar – Mit Vinlager";

                    }

                    catch (
                        error
                    ) {

                        console.error(
                            error
                        );


                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "⚠️ Google er logget ind, "
                            + "men lageret kunne ikke læses.";

                    }

                }

        });


    googleTokenClient.requestAccessToken({

        prompt:
            "consent"

    });

}


/* =====================================================
   GOOGLE LOGOUT
===================================================== */

function logoutGoogle() {

    if (
        googleAccessToken &&
        window.google
    ) {

        google.accounts.oauth2.revoke(
            googleAccessToken
        );

    }


    googleAccessToken =
        null;


    wines = [];


    googleFolderId =
        null;


    localStorage.removeItem(
        "vinlagerGoogleFolderId"
    );


    document.getElementById(
        "googleStatus"
    ).textContent =
        "☁️ Ikke forbundet til Google Drive";


    document.getElementById(
        "googleLoginButton"
    ).style.display =
        "block";


    document.getElementById(
        "googleLogoutButton"
    ).style.display =
        "none";


    updateFrontPageCounts();

}


/* =====================================================
   GOOGLE DRIVE REQUEST
===================================================== */

async function driveRequest(
    url,
    options = {}
) {

    if (
        !googleAccessToken
    ) {

        throw new Error(
            "Ikke logget ind på Google Drive."
        );

    }


    const headers =
        options.headers || {};


    headers.Authorization =
        "Bearer "
        + googleAccessToken;


    options.headers =
        headers;


    const response =
        await fetch(
            url,
            options
        );


    /*
       Hvis token er udløbet.
    */

    if (
        response.status === 401
    ) {

        googleAccessToken =
            null;


        document.getElementById(
            "googleStatus"
        ).textContent =
            "⚠️ Google-login skal fornys.";


        throw new Error(
            "Google-login er udløbet. Log ind igen."
        );

    }


    if (
        !response.ok
    ) {

        let errorText =
            "";


        try {

            const errorData =
                await response.json();


            errorText =
                errorData.error?.message
                ||
                JSON.stringify(
                    errorData
                );

        }

        catch {

            errorText =
                await response.text();

        }


        throw new Error(
            errorText
        );

    }


    return response;

}


/* =====================================================
   FIND / OPRET VINLAGER-MAPPE
===================================================== */

async function getOrCreateWineFolder() {

    if (
        googleFolderId
    ) {

        return googleFolderId;

    }


    const searchUrl =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            "name='Mit Vinlager'"
            + " and mimeType='application/vnd.google-apps.folder'"
            + " and trashed=false"
        )
        + "&spaces=drive"
        + "&fields=files(id,name)";


    const response =
        await driveRequest(
            searchUrl
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length > 0
    ) {

        googleFolderId =
            data.files[0].id;


        localStorage.setItem(
            "vinlagerGoogleFolderId",
            googleFolderId
        );


        return googleFolderId;

    }


    const createResponse =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            "Mit Vinlager",

                        mimeType:
                            "application/vnd.google-apps.folder"

                    })

            }
        );


    const folder =
        await createResponse.json();


    googleFolderId =
        folder.id;


    localStorage.setItem(
        "vinlagerGoogleFolderId",
        googleFolderId
    );


    return googleFolderId;

}


/* =====================================================
   FIND FIL I VINLAGER
===================================================== */

async function findDriveFile(
    fileName
) {

    if (
        !googleFolderId
    ) {

        throw new Error(
            "Google Drive-mappen er ikke klar."
        );

    }


    const safeName =
        fileName.replace(
            /'/g,
            "\\'"
        );


    const query =
        "name='"
        + safeName
        + "'"
        + " and '"
        + googleFolderId
        + "' in parents"
        + " and trashed=false";


    const url =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            query
        )
        + "&spaces=drive"
        + "&fields=files(id,name,mimeType,size)";


    const response =
        await driveRequest(
            url
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length
    ) {

        return data.files[0];

    }


    return null;

}

/* =====================================================
   GEM WINES.JSON
===================================================== */

async function saveWinesToDrive(
    wineList
) {

    const json =
        JSON.stringify(
            wineList,
            null,
            2
        );


    const existingFile =
        await findDriveFile(
            "wines.json"
        );


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--"
        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const metadata = {

        name:
            "wines.json",

        mimeType:
            "application/json"

    };


    if (
        !existingFile
    ) {

        metadata.parents =
            [googleFolderId];

    }


    const body =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(
            metadata
        )
        + delimiter
        + "Content-Type: application/json\r\n\r\n"
        + json
        + closeDelimiter;


    let url;

    let method;


    if (
        existingFile
    ) {

        url =
            "https://www.googleapis.com/upload/drive/v3/files/"
            + existingFile.id
            + "?uploadType=multipart";


        method =
            "PATCH";

    }

    else {

        url =
            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart";


        method =
            "POST";

    }


    await driveRequest(
        url,
        {

            method:
                method,

            headers: {

                "Content-Type":
                    "multipart/related; boundary="
                    + boundary

            },

            body:
                body

        }
    );

}


/* =====================================================
   KOMPRIMER BILLEDE
===================================================== */

function compressImage(
    file
) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const image =
                        new Image();


                    image.onload =
                        function() {

                            const MAX_WIDTH =
                                1200;


                            let width =
                                image.width;


                            let height =
                                image.height;


                            if (
                                width >
                                MAX_WIDTH
                            ) {

                                height =
                                    height
                                    *
                                    MAX_WIDTH
                                    /
                                    width;


                                width =
                                    MAX_WIDTH;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(

                                function(blob) {

                                    if (
                                        !blob
                                    ) {

                                        reject(
                                            new Error(
                                                "Kunne ikke komprimere billedet."
                                            )
                                        );


                                        return;

                                    }


                                    resolve(
                                        blob
                                    );

                                },

                                "image/jpeg",

                                0.78

                            );

                        };


                    image.onerror =
                        reject;


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   UPLOAD BILLEDE
===================================================== */

async function uploadWinePhoto(
    file,
    wineId
) {

    if (
        !file
    ) {

        return null;

    }


    const compressed =
        await compressImage(
            file
        );


    const fileName =
        "vin_"
        + wineId
        + ".jpg";


    const metadata = {

        name:
            fileName,

        mimeType:
            "image/jpeg",

        parents:
            [googleFolderId]

    };


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--"
        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const metadataPart =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(
            metadata
        );


    const imagePart =
        delimiter
        + "Content-Type: image/jpeg\r\n\r\n";


    const body =
        new Blob(
            [

                metadataPart,

                imagePart,

                compressed,

                closeDelimiter

            ],

            {

                type:
                    "multipart/related; boundary="
                    + boundary

            }
        );


    const response =
        await driveRequest(

            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "multipart/related; boundary="
                        + boundary

                },

                body:
                    body

            }

        );


    const data =
        await response.json();


    return data.id;

}

/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(
    result
) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {

        return;

    }


    if (
        code === lastCode
    ) {

        detectionCount++;

    }

    else {

        lastCode =
            code;

        detectionCount =
            1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(
            code
        );

    }

}

   AFSLUT SCANNING

    stopScanner();

    if (

    try {

        Quagga.offDetected(

        );


        Quagga.stop();

    }

    }


    scannerRunning =

}

/* =====================================================
   AUTOMATISK VINOPSLAG
===================================================== */

async function lookupWine(
    code
) {

    const status =
        document.getElementById(
            "lookupStatus"
        );


    status.className =
        "lookupStatus";


    status.textContent =
        "🔎 Søger efter vin...";


    const fields = [

        "code",

        "product_name",

        "product_name_da",

        "generic_name",

        "generic_name_da",

        "brands",

        "categories",

        "categories_tags",

        "countries",

        "countries_tags",

        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/"
        + encodeURIComponent(
            code
        )
        + "?product_type=all"
        + "&lc=da"
        + "&cc=dk"
        + "&fields="
        + encodeURIComponent(
            fields
        );


    try {

        const response =
            await fetch(
                url,
                {
                    method:
                        "GET"
                }
            );


        if (
            !response.ok
        ) {

            if (
                response.status === 404
            ) {

                lookupWineData =
                    null;


                status.className =
                    "lookupStatus lookupWarning";


                status.textContent =
                    "⚠️ Stregkoden findes ikke "
                    + "i databasen. Du kan indtaste "
                    + "vinen manuelt.";


                return;

            }


            throw new Error(
                "HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        const product =
            data.product;


        if (
            !product
        ) {

            lookupWineData =
                null;


            status.className =
                "lookupStatus lookupWarning";


            status.textContent =
                "⚠️ Vinen blev ikke fundet "
                + "i databasen.";


            return;

        }


        const name =

            product.product_name_da
            ||
            product.product_name
            ||
            product.generic_name_da
            ||
            product.generic_name
            ||
            "";


        const producer =
            product.brands
            ||
            "";


        const country =
            extractCountry(
                product
            );


        const type =
            detectWineType(
                product
            );


        lookupWineData = {

            name:
                name,

            producer:
                producer,

            country:
                country,

            type:
                type

        };


        status.className =
            "lookupStatus lookupSuccess";


        if (
            name
        ) {

            status.textContent =
                "✅ Vin fundet: "
                + name
                + ". Kontrollér oplysningerne "
                + "før du gemmer.";

        }

        else {

            status.textContent =
                "✅ Stregkoden blev fundet, "
                + "men der mangler vinoplysninger.";

        }

    }

    catch (
        error
    ) {

        console.error(
            "Vinopslag fejlede:",
            error
        );


        lookupWineData =
            null;


        status.className =
            "lookupStatus lookupError";


        status.textContent =
            "⚠️ Kunne ikke kontakte "
            + "vin-databasen. "
            + "Du kan stadig indtaste "
            + "vinen manuelt.";

    }

}


/* =====================================================
   FIND LAND
===================================================== */

function extractCountry(
    product
) {

    if (
        Array.isArray(
            product.countries_tags
        )
        &&
        product.countries_tags.length
    ) {

        return cleanTaxonomyValue(
            product.countries_tags[0]
        );

    }


    if (
        product.countries
    ) {

        return product.countries
            .split(",")[0]
            .trim();

    }


    if (
        product.origins
    ) {

        return product.origins
            .split(",")[0]
            .trim();

    }


    return "";

}


/* =====================================================
   RENS TAXONOMI
===================================================== */

function cleanTaxonomyValue(
    value
) {

    if (
        !value
    ) {

        return "";

    }


    const parts =
        value.split(":");


    if (
        parts.length > 1
    ) {

        return parts
            .slice(1)
            .join(":")
            .replace(
                /-/g,
                " "
            );

    }


    return value.replace(
        /-/g,
        " "
    );

}


/* =====================================================
   GENKENDEL VINTYPE
===================================================== */

function detectWineType(
    product
) {

    const text = (

        (
            product.product_name
            ||
            ""
        )

        + " "

        +

        (
            product.product_name_da
            ||
            ""
        )

        + " "

        +

        (
            product.generic_name
            ||
            ""
        )

        + " "

        +

        (
            product.generic_name_da
            ||
            ""
        )

        + " "

        +

        (
            product.categories
            ||
            ""
        )

        + " "

        +

        (
            Array.isArray(
                product.categories_tags
            )

            ?

            product.categories_tags.join(
                " "
            )

            :

            ""
        )

    ).toLowerCase();


    /* CHAMPAGNE */

    if (
        text.includes(
            "champagne"
        )
    ) {

        return "Champagne";

    }


    /* PORTVIN */

    if (

        text.includes(
            "port wine"
        )

        ||

        text.includes(
            "portwine"
        )

        ||

        text.includes(
            "portvin"
        )

        ||

        text.includes(
            "porto"
        )

    ) {

        return "Portvin";

    }


    /* MOUSSERENDE */

    if (

        text.includes(
            "sparkling"
        )

        ||

        text.includes(
            "mousser"
        )

        ||

        text.includes(
            "prosecco"
        )

        ||

        text.includes(
            "cava"
        )

        ||

        text.includes(
            "crémant"
        )

        ||

        text.includes(
            "cremant"
        )

        ||

        text.includes(
            "sekt"
        )

    ) {

        return "Mousserende";

    }


    /* ROSÉ */

    if (

        text.includes(
            "rosé"
        )

        ||

        text.includes(
            "rose wine"
        )

        ||

        text.includes(
            "rosé wine"
        )

        ||

        text.includes(
            "rosévin"
        )

        ||

        text.includes(
            "rosé vin"
        )

        ||

        text.includes(
            "vin rosé"
        )

        ||

        text.includes(
            "vino rosato"
        )

        ||

        text.includes(
            "rosato"
        )

        ||

        text.includes(
            "vin rosé"
        )

    ) {

        return "Rosévin";

    }


    /* SPIRITUS */

    if (

        text.includes(
            "spirit"
        )

        ||

        text.includes(
            "whisky"
        )

        ||

        text.includes(
            "whiskey"
        )

        ||

        text.includes(
            "vodka"
        )

        ||

        text.includes(
            "gin"
        )

        ||

        text.includes(
            "rum"
        )

        ||

        text.includes(
            "brandy"
        )

        ||

        text.includes(
            "cognac"
        )

        ||

        text.includes(
            "liqueur"
        )

        ||

        text.includes(
            "likør"
        )

    ) {

        return "Spiritus";

    }


    /* HVIDVIN */

    if (

        text.includes(
            "white wine"
        )

        ||

        text.includes(
            "white-wine"
        )

        ||

        text.includes(
            "hvidvin"
        )

        ||

        text.includes(
            "vino bianco"
        )

        ||

        text.includes(
            "vin blanc"
        )

        ||

        text.includes(
            "weisswein"
        )

        ||

        text.includes(
            "weißwein"
        )

    ) {

        return "Hvidvin";

    }


    /* RØDVIN */

    if (

        text.includes(
            "red wine"
        )

        ||

        text.includes(
            "red-wine"
        )

        ||

        text.includes(
            "rødvin"
        )

        ||

        text.includes(
            "vino rosso"
        )

        ||

        text.includes(
            "vin rouge"
        )

        ||

        text.includes(
            "rotwein"
        )

    ) {

        return "Rødvin";

    }


    return "Rødvin";

}

            + "Kontrollér dem før du gemmer.";

    }

}

/* =====================================================
   GEM VIN
===================================================== */

async function saveWine() {

    if (
        !googleAccessToken
    ) {

        alert(
            "Log ind med Google Drive først."
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveWineButton"
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        "☁️ Gemmer…";


    try {

        await getOrCreateWineFolder();


        /* ---------------------------------------------
           OPDATER EKSISTERENDE VIN
        --------------------------------------------- */

        if (
            editingWineId
        ) {

            const index =
                wines.findIndex(
                    function(item) {

                        return String(
                            item.id
                        )
                        ===
                        String(
                            editingWineId
                        );

                    }
                );


            if (
                index < 0
            ) {

                throw new Error(
                    "Vinen kunne ikke findes i lageret."
                );

            }


            const oldWine =
                wines[index];


            const wine = {

                ...oldWine,

                barcode:
                    document.getElementById(
                        "wineBarcode"
                    ).value.trim(),

                name:
                    document.getElementById(
                        "wineName"
                    ).value.trim(),

                producer:
                    document.getElementById(
                        "wineProducer"
                    ).value.trim(),

                year:
                    document.getElementById(
                        "wineYear"
                    ).value,

                type:
                    document.getElementById(
                        "wineType"
                    ).value,

                country:
                    document.getElementById(
                        "wineCountry"
                    ).value.trim(),

                quantity:
                    Math.max(
                        0,
                        parseInt(
                            document.getElementById(
                                "wineQuantity"
                            ).value,
                            10
                        )
                        ||
                        0
                    ),

                location:
                    document.getElementById(
                        "wineLocation"
                    ).value.trim(),

                notes:
                    document.getElementById(
                        "wineNotes"
                    ).value.trim(),

                dateModified:
                    new Date().toISOString()

            };


            const photoInput =
                document.getElementById(
                    "winePhoto"
                );


            const photoFile =
                photoInput.files[0]
                ||
                null;


            /*
               Upload kun nyt billede er valgt.
            */

            if (
                photoFile
            ) {

                const status =
                    document.getElementById(
                        "formLookupStatus"
                    );


                status.style.display =
                    "block";


                status.className =
                    "lookupStatus";


                status.textContent =
                    "☁️ Gemmer nyt billede…";


                wine.photoFileId =
                    await uploadWinePhoto(
                        photoFile,
                        wine.id
                    );

            }


            wines[index] =
                wine;


            await saveWinesToDrive(
                wines
            );


            updateFrontPageCounts();


            alert(
                "✅ Vinen er opdateret."
            );


            showHome();


            return;

        }


        /* ---------------------------------------------
           NY VIN
        --------------------------------------------- */

        const wine = {

            id:
                Date.now().toString(),

            barcode:
                document.getElementById(
                    "wineBarcode"
                ).value.trim(),

            name:
                document.getElementById(
                    "wineName"
                ).value.trim(),

            producer:
                document.getElementById(
                    "wineProducer"
                ).value.trim(),

            year:
                document.getElementById(
                    "wineYear"
                ).value,

            type:
                document.getElementById(
                    "wineType"
                ).value,

            country:
                document.getElementById(
                    "wineCountry"
                ).value.trim(),

            quantity:
                Math.max(
                    0,
                    parseInt(
                        document.getElementById(
                            "wineQuantity"
                        ).value,
                        10
                    )
                    ||
                    0
                ),

            location:
                document.getElementById(
                    "wineLocation"
                ).value.trim(),

            notes:
                document.getElementById(
                    "wineNotes"
                ).value.trim(),

            photoFileId:
                null,

            dateAdded:
                new Date().toISOString()

        };


        const photoInput =
            document.getElementById(
                "winePhoto"
            );


        const photoFile =
            photoInput.files[0]
            ||
            null;


        /*
           Upload billede først.
        */

        if (
            photoFile
        ) {

            const status =
                document.getElementById(
                    "formLookupStatus"
                );


            status.style.display =
                "block";


            status.className =
                "lookupStatus";


            status.textContent =
                "☁️ Gemmer billede…";


            wine.photoFileId =
                await uploadWinePhoto(
                    photoFile,
                    wine.id
                );

        }


        /*
           Tilføj til vores lokale lager.
        */

        wines.push(
            wine
        );


        /*
           Gem hele lageret.
        */

        document.getElementById(
            "formLookupStatus"
        ).style.display =
            "block";


        document.getElementById(
            "formLookupStatus"
        ).textContent =
            "☁️ Gemmer vinlager…";


        await saveWinesToDrive(
            wines
        );


        updateFrontPageCounts();


        alert(
            "✅ Vinen er gemt i Google Drive."
        );


        showHome();

    }

    catch (
        error
    ) {

        console.error(
            "Google Drive fejl:",
            error
        );


        alert(
            "⚠️ Der opstod en fejl ved "
            + "gemning til Google Drive.\n\n"
            + error.message
        );

    }

    finally {

        saveButton.disabled =
            false;


        saveButton.textContent =
            "💾 Gem vin";

    }

}


/* =====================================================
   SLET VIN
===================================================== */

async function deleteWine(
    wineId
) {

    const wine =
        wines.find(
            function(item) {

                return String(
                    item.id
                )
                ===
                String(
                    wineId
                );

            }
        );


    if (
        !wine
    ) {

        return;

    }


    const confirmed =
        confirm(
            "Vil du slette:\n\n"
            + (
                wine.name
                ||
                "Denne vin"
            )
            + "?"
        );


    if (
        !confirmed
    ) {

        return;

    }


    if (
        !googleAccessToken
    ) {

        alert(
            "Log ind på Google Drive først."
        );

        return;

    }


    try {

        wines =
            wines.filter(
                function(item) {

                    return String(
                        item.id
                    )
                    !==
                    String(
                        wineId
                    );

                }
            );


        await saveWinesToDrive(
            wines
        );


        updateFrontPageCounts();


        renderCurrentPage();


    }

    catch (
        error
    ) {

        console.error(
            error
        );


        alert(
            "⚠️ Vinen kunne ikke slettes.\n\n"
            + error.message
        );

    }

}


/* =====================================================
   ÆNDR ANTAL
===================================================== */

async function changeQuantity(
    wineId,
    amount
) {

    const wine =
        wines.find(
            function(item) {

                return String(
                    item.id
                )
                ===
                String(
                    wineId
                );

            }
        );


    if (
        !wine
    ) {

        return;

    }


    const oldQuantity =
        getQuantity(
            wine
        );


    const newQuantity =
        Math.max(
            0,
            oldQuantity + amount
        );


    if (
        newQuantity ===
        oldQuantity
    ) {

        return;

    }


    wine.quantity =
        newQuantity;


    /*
       Opdater brugerfladen straks.
    */

    updateFrontPageCounts();

    renderCurrentPage();


    /*
       Gem i baggrunden.
    */

    if (
        googleAccessToken
    ) {

        try {

            await saveWinesToDrive(
                wines
            );

        }

        catch (
            error
        ) {

            console.error(
                error
            );


            alert(
                "⚠️ Antallet blev ændret lokalt, "
                + "men kunne ikke gemmes på Google Drive.\n\n"
                + error.message
            );

        }

    }

}

/* =====================================================
   FORSIDE
===================================================== */

function showHome() {

    showOnlyPage(
        "homePage"
    );


    lookupWineData =

    updateFrontPageCounts();

/* =====================================================
   OPDATER ANTAL PÅ FORSIDEN
===================================================== */

function updateFrontPageCounts() {

    const categories = [

        "Rødvin",

        "Hvidvin",

        "Rosévin",

        "Mousserende",

        "Champagne",

        "Portvin",

        "Spiritus"

    ];


    categories.forEach(
        function(category) {

            const count =
                wines
                    .filter(
                        function(wine) {

                            return wine.type
                                ===
                                category;

                        }
                    )
                    .reduce(
                        function(total, wine) {

                            return total +
                                getQuantity(
                                    wine
                                );

                        },
                        0
                    );


            const elementId =
                "count"
                +
                category;


            const element =
                document.getElementById(
                    elementId
                );


            if (
                element
            ) {

                element.textContent =
                    count;

            }

        }
    );


    const status =
        document.getElementById(
            "inventoryStatus"
        );


    if (
        status &&
        googleAccessToken
    ) {

        status.textContent =
            "📦 "
            + totalBottleCount(
                wines
            )
            + " flasker på lager";

    }

}

/* =====================================================
   SØGNING
===================================================== */

function performSearch() {

    const query =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    if (
        !query
    ) {

        document.getElementById(
            "searchInfo"
        ).textContent =
            wines.length
            + " forskellige vine i lageret";


        document.getElementById(
            "searchResults"
        ).innerHTML =
            "";


        return;

    }


    const results =
        wines.filter(
            function(wine) {

                const searchable = [

                    wine.name,

                    wine.producer,

                    wine.barcode,

                    wine.country,

                    wine.location,

                    wine.notes,

                    wine.type,

                    wine.year

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return searchable.includes(
                    query
                );

            }
        );


    document.getElementById(
        "searchInfo"
    ).textContent =
        results.length
        + " vin"
        + (
            results.length === 1
            ? ""
            : "e"
        )
        + " fundet";


    renderWineList(
        results,
        "searchResults"
    );

}

   KATEGORI

        "<div class='categoryHeaderCount'>"

        + " flasker · "
        + categoryWines.length
        + " forskellige vine"
        + "</div>";


    renderWineList(
        categoryWines,
        "categoryResults"
    );

}


/* =====================================================
   RENDER VINALISTE
===================================================== */

function renderWineList(
    list,
    containerId
) {

    const container =
        document.getElementById(
            containerId
        );


    if (
        !container
    ) {

        return;

    }


    if (
        !list ||
        list.length === 0
    ) {

        container.innerHTML =

            "<div class='emptyState'>"
            + "🍷 Ingen vine fundet."
            + "</div>";

        return;

    }


    /*
       Sortér alfabetisk efter navn.
    */

    const sorted =
        [...list].sort(
            function(a, b) {

                return (
                    (
                        a.name
                        ||
                        ""
                    )
                    .toLowerCase()
                )
                .localeCompare(
                    (
                        b.name
                        ||
                        ""
                    )
                    .toLowerCase(),
                    "da"
                );

            }
        );


    container.innerHTML =
        sorted
            .map(
                createWineCard
            )
            .join("");

}


/* =====================================================
   VINKORT
===================================================== */

function createWineCard(
    wine
) {

    const quantity =
        getQuantity(
            wine
        );


    const name =
        escapeHtml(
            wine.name
            ||
            "Ukendt vin"
        );


    const producer =
        escapeHtml(
            wine.producer
            ||
            ""
        );


    let meta = "";


    if (
        wine.year
    ) {

        meta +=
            "Årgang: "
            + escapeHtml(
                wine.year
            )
            + "<br>";

    }


    if (
        wine.country
    ) {

        meta +=
            "Land: "
            + escapeHtml(
                wine.country
            )
            + "<br>";

    }


    if (
        wine.type
    ) {

        meta +=
            "Type: "
            + escapeHtml(
                wine.type
            )
            + "<br>";

    }


    if (
        wine.barcode
    ) {

        meta +=
            "EAN: "
            + escapeHtml(
                wine.barcode
            )
            + "<br>";

    }


    if (
        wine.location
    ) {

        meta +=
            "📍 "
            + escapeHtml(
                wine.location
            )
            + "<br>";

    }


    if (
        wine.notes
    ) {

        meta +=
            "📝 "
            + escapeHtml(
                wine.notes
            );

    }


    let photoHtml =
        "";


    if (
        wine.photoFileId
    ) {

        photoHtml =

            "<img "
            + "class='winePhoto' "
            + "src='https://drive.google.com/uc?export=view&id="
            + encodeURIComponent(
                wine.photoFileId
            )
            + "' "
            + "alt='Billede af "
            + name
            + "' "
            + "loading='lazy'>";

    }


    return

        "<div class='wineCard'>"

        +

        "<div class='wineCardHeader'>"

        +

        "<div>"

        +

        "<div class='wineCardName'>"
        + name
        + "</div>"

        +

        (
            producer
            ?

            "<div class='wineCardProducer'>"
            + producer
            + "</div>"

            :

            ""
        )

        +

        "</div>"

        +

        "</div>"

        +

        (
            meta
            ?

            "<div class='wineCardMeta'>"
            + meta
            + "</div>"

            :

            ""
        )

        +

        photoHtml

        +

        "<div class='quantityBox'>"

        +

        "<strong>Antal på lager</strong>"

        +

        "<div class='quantityControls'>"

        +

        "<button "
        + "onclick=\"changeQuantity('"
        + escapeJs(
            wine.id
        )
        + "', -1)\">"
        + "−"
        + "</button>"

        +

        "<div class='quantityNumber'>"
        + quantity
        + "</div>"

        +

        "<button "
        + "onclick=\"changeQuantity('"
        + escapeJs(
            wine.id
        )
        + "', 1)\">"
        + "+"
        + "</button>"

        +

        "</div>"

        +

        "</div>"

        +

        "<div class='cardActions'>"

        +

        "<button "
        + "class='editButton' "
        + "onclick=\"editWine('"
        + escapeJs(
            wine.id
        )
        + "')\">"
        + "✏️ Rediger"
        + "</button>"

        +

        "<button "
        + "class='deleteButton' "
        + "onclick=\"deleteWine('"
        + escapeJs(
            wine.id
        )
        + "')\">"
        + "🗑️ Slet"
        + "</button>"

        +

        "</div>"

        +

        "</div>";

}


/* =====================================================
   HTML SIKKERHED
===================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   JAVASCRIPT SIKKERHED
===================================================== */

function escapeJs(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(
        value
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =====================================================
   GENRENDER AKTUEL SIDE
===================================================== */

function renderCurrentPage() {

    const visiblePages =
        document.querySelectorAll(
            ".page"
        );


    let visiblePageId =
        null;


    visiblePages.forEach(
        function(page) {

            if (
                page.style.display ===
                "block"
            ) {

                visiblePageId =
                    page.id;

            }

        }
    );


    if (
        visiblePageId ===
        "inventoryPage"
    ) {

        document.getElementById(
            "inventoryPageInfo"
        ).textContent =
            totalBottleCount(
                wines
            )
            + " flasker på lager";


        renderWineList(
            wines,
            "inventoryResults"
        );

    }


    else if (
        visiblePageId ===
        "categoryPage"
    ) {

        showCategory(
            currentCategory
        );

    }


    else if (
        visiblePageId ===
        "searchPage"
    ) {

        performSearch();

    }

}


/* =====================================================
   STARTAPP
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateFrontPageCounts();

    }
);

</script>
