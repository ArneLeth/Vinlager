<script>


/* =====================================================
   SCANNER VARIABLER
===================================================== */

let scannerRunning = false;

let lastCode = "";

let detectionCount = 0;

const REQUIRED_DETECTIONS = 2;


/* =====================================================
   OPSLAGSDATA
===================================================== */

let lookupWineData = null;


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {


    document.getElementById(
        "homePage"
    ).style.display = "none";


    document.getElementById(
        "addPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "scannerPage"
    ).style.display = "block";


    lastCode = "";

    detectionCount = 0;


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "Starter kamera…";


    const config = {


        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.querySelector(
                    "#camera"
                ),


            constraints: {

                width: {
                    min: 640,
                    ideal: 1920
                },

                height: {
                    min: 480,
                    ideal: 1080
                },

                facingMode: {
                    ideal: "environment"
                },

                aspectRatio: {
                    ideal: 16 / 9
                },

                focusMode:
                    "continuous"

            },


            area: {

                top: "25%",

                right: "5%",

                left: "5%",

                bottom: "25%"

            }

        },


        locator: {

            patchSize: "medium",

            halfSample: true

        },


        frequency: 15,


        decoder: {

            readers: [
                "ean_reader",
                "ean_8_reader"
            ]

        },


        locate: true,


        numOfWorkers:

            navigator.hardwareConcurrency
            ? Math.min(
                navigator.hardwareConcurrency,
                4
              )
            : 2

    };


    Quagga.init(

        config,

        function(error) {


            if (error) {

                console.error(error);


                document.getElementById(
                    "scannerStatus"
                ).textContent =
                    "Kameraet kunne ikke startes.";


                return;

            }


            Quagga.start();


            scannerRunning = true;


            document.getElementById(
                "scannerStatus"
            ).textContent =
                "Scanner…";


            Quagga.onDetected(
                barcodeDetected
            );

        }

    );

}


/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(result) {


    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {
        return;
    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {
        return;
    }


    if (code === lastCode) {

        detectionCount++;

    } else {

        lastCode = code;

        detectionCount = 1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(code);

    }

}


/* =====================================================
   AFSLUT SCANNING
===================================================== */

function finishScan(code) {


    stopScanner();


    lookupWineData = null;


    document.getElementById(
        "barcode"
    ).textContent = code;


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "block";


    lookupWine(code);

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {


    if (!scannerRunning) {
        return;
    }


    try {

        Quagga.offDetected(
            barcodeDetected
        );

        Quagga.stop();

    }

    catch (error) {

        console.log(error);

    }


    scannerRunning = false;

}


/* =====================================================
   LUK SCANNER
===================================================== */

function closeScanner() {


    stopScanner();


    document.getElementById(
        "scannerPage"
    ).style.display = "none";


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    document.getElementById(
        "homePage"
    ).style.display = "block";

}


/* =====================================================
   SCAN IGEN
===================================================== */

function scanAgain() {


    lookupWineData = null;


    document.getElementById(
        "scanResult"
    ).style.display = "none";


    startScanner();

}


/* =====================================================
   AUTOMATISK VINOPSLAG
===================================================== */

async function lookupWine(code) {


    const status =
        document.getElementById(
            "lookupStatus"
        );


    status.className =
        "lookupStatus";


    status.textContent =
        "🔎 Søger efter vin...";


    /*
       Vi bruger den aktuelle v3 API.

       Kun nødvendige felter hentes.
    */

    const fields = [

        "code",
        "product_name",
        "product_name_da",
        "generic_name",
        "generic_name_da",
        "brands",
        "categories",
        "categories_tags",
        "countries",
        "countries_tags",
        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/"
        + encodeURIComponent(code)
        + "?product_type=all"
        + "&lc=da"
        + "&cc=dk"
        + "&fields="
        + encodeURIComponent(fields);


    console.log(
        "Open Food Facts URL:",
        url
    );


    try {


        const response =
            await fetch(
                url,
                {
                    method: "GET"
                }
            );


        console.log(
            "API HTTP status:",
            response.status
        );


        if (!response.ok) {

            if (
                response.status === 404
            ) {

                lookupWineData = null;


                status.className =
                    "lookupStatus lookupWarning";


                status.textContent =
                    "⚠️ Stregkoden findes ikke "
                    + "i databasen. Du kan indtaste "
                    + "vinen manuelt.";


                return;

            }


            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Open Food Facts svar:",
            data
        );


        /*
           V3 bruger product-objektet,
           og status kan være success.
        */

        const product =
            data.product;


        if (
            !product
        ) {

            lookupWineData = null;


            status.className =
                "lookupStatus lookupWarning";


            status.textContent =
                "⚠️ Vinen blev ikke fundet "
                + "i databasen.";


            return;

        }


        /*
           Hent navn.

           Vi prioriterer dansk,
           derefter almindeligt navn.
        */

        const name =

            product.product_name_da
            ||
            product.product_name
            ||
            product.generic_name_da
            ||
            product.generic_name
            ||
            "";


        /*
           Producent
        */

        const producer =
            product.brands || "";


        /*
           Land
        */

        const country =
            extractCountry(
                product
            );


        /*
           Type
        */

        const type =
            detectWineType(
                product
            );


        lookupWineData = {

            name: name,

            producer: producer,

            country: country,

            type: type

        };


        /*
           Vis succes
        */

        status.className =
            "lookupStatus lookupSuccess";


        if (name) {

            status.textContent =
                "✅ Vin fundet: "
                + name
                + ". Kontrollér oplysningerne "
                + "før du gemmer.";

        } else {

            status.textContent =
                "✅ Stregkoden blev fundet, "
                + "men der mangler vinoplysninger. "
                + "Kontrollér formularen.";

        }


    }

    catch (error) {


        console.error(
            "Vinopslag fejlede:",
            error
        );


        lookupWineData = null;


        status.className =
            "lookupStatus lookupError";


        status.textContent =
            "⚠️ Kunne ikke kontakte "
            + "vin-databasen. "
            + "Du kan stadig indtaste "
            + "vinen manuelt.";

    }

}


/* =====================================================
   FIND LAND
===================================================== */

function extractCountry(product) {


    /*
       Først countries_tags
    */

    if (
        Array.isArray(
            product.countries_tags
        )
        &&
        product.countries_tags.length
    ) {

        const country =
            product.countries_tags[0];


        return cleanTaxonomyValue(
            country
        );

    }


    /*
       Derefter countries
    */

    if (
        product.countries
    ) {

        return product.countries
            .split(",")[0]
            .trim();

    }


    /*
       Til sidst origins
    */

    if (
        product.origins
    ) {

        return product.origins
            .split(",")[0]
            .trim();

    }


    return "";

}


/* =====================================================
   RENS OPEN FOOD FACTS TAXONOMI
===================================================== */

function cleanTaxonomyValue(value) {


    if (!value) {
        return "";
    }


    /*
       Eksempel:

       en:france
       da:frankrig
       fr:france
    */

    const parts =
        value.split(":");


    if (
        parts.length > 1
    ) {

        return parts
            .slice(1)
            .join(":")
            .replace(/-/g, " ");

    }


    return value
        .replace(/-/g, " ");

}


/* =====================================================
   GENKENDEL VINTYPE
===================================================== */

function detectWineType(product) {


    const text = (

        (
            product.product_name
            || ""
        )

        + " "

        +

        (
            product.product_name_da
            || ""
        )

        + " "

        +

        (
            product.generic_name
            || ""
        )

        + " "

        +

        (
            product.categories
            || ""
        )

        + " "

        +

        (
            Array.isArray(
                product.categories_tags
            )
            ?
            product.categories_tags.join(" ")
            :
            ""
        )

    ).toLowerCase();


    /*
       Champagne
    */

    if (
        text.includes("champagne")
    ) {

        return "Champagne";

    }


    /*
       Portvin
    */

    if (

        text.includes("port wine")
        ||
        text.includes("portwine")
        ||
        text.includes("portvin")
        ||
        text.includes("porto")

    ) {

        return "Portvin";

    }


    /*
       Mousserende
    */

    if (

        text.includes("sparkling")
        ||
        text.includes("mousser")
        ||
        text.includes("prosecco")
        ||
        text.includes("cava")
        ||
        text.includes("crémant")
        ||
        text.includes("cremant")
        ||
        text.includes("sekt")

    ) {

        return "Mousserende";

    }


    /*
       Spiritus
    */

    if (

        text.includes("spirit")
        ||
        text.includes("whisky")
        ||
        text.includes("whiskey")
        ||
        text.includes("vodka")
        ||
        text.includes("gin")
        ||
        text.includes("rum")
        ||
        text.includes("brandy")
        ||
        text.includes("cognac")
        ||
        text.includes("liqueur")
        ||
        text.includes("likør")

    ) {

        return "Spiritus";

    }


    /*
       Hvidvin
    */

    if (

        text.includes("white wine")
        ||
        text.includes("white-wine")
        ||
        text.includes("hvidvin")
        ||
        text.includes("vino bianco")
        ||
        text.includes("vin blanc")
        ||
        text.includes("weisswein")
        ||
        text.includes("weißwein")

    ) {

        return "Hvidvin";

    }


    /*
       Rødvin
    */

    if (

        text.includes("red wine")
        ||
        text.includes("red-wine")
        ||
        text.includes("rødvin")
        ||
        text.includes("vino rosso")
        ||
        text.includes("vin rouge")
        ||
        text.includes("rotwein")

    ) {

        return "Rødvin";

    }


    /*
       Hvis vi ikke kan bestemme typen
    */

    return "Rødvin";

}


/* =====================================================
   FORTSÆT MED STREGKODE
===================================================== */

function continueWithBarcode() {


    const code =
        document.getElementById(
            "barcode"
        ).textContent;


    showAddForm(
        code,
        lookupWineData
    );

}


/* =====================================================
   RESET VINFORMULAR
===================================================== */

function resetWineForm() {


    const form =
        document.getElementById(
            "addPage"
        );


    const inputs =
        form.querySelectorAll(
            "input"
        );


    inputs.forEach(
        function(input) {


            if (
                input.type === "file"
            ) {

                input.value = "";

            }

            else if (
                input.type === "number"
            ) {


                if (
                    input.id ===
                    "wineQuantity"
                ) {

                    input.value = "1";

                }

                else {

                    input.value = "";

                }

            }

            else {

                input.value = "";

            }

        }
    );


    document.getElementById(
        "wineType"
    ).selectedIndex = 0;


    document.getElementById(
        "wineNotes"
    ).value = "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    preview.removeAttribute(
        "src"
    );


    preview.style.display =
        "none";


    document.getElementById(
        "winePhoto"
    ).value = "";


    const formStatus =
        document.getElementById(
            "formLookupStatus"
        );


    formStatus.style.display =
        "none";


    formStatus.textContent =
        "";


    formStatus.className =
        "lookupStatus";

}


/* =====================================================
   VIS TILFØJ VIN
===================================================== */

function showAddForm(
    code,
    wineData

/* =====================================================
   FOTO PREVIEW
===================================================== */

function previewPhoto(event) {


    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const image =
        document.getElementById(
            "photoPreview"
        );


    image.src =
        URL.createObjectURL(
            file
        );


    image.style.display =
        "block";

}

===================================================== */

function saveWine() {


    const wine = {

        barcode:
            document.getElementById(
                "wineBarcode"
            ).value,

        name:
            document.getElementById(
                "wineName"
            ).value,

        producer:
            document.getElementById(
                "wineProducer"
            ).value,

        year:
            document.getElementById(
                "wineYear"
            ).value,

        type:
            document.getElementById(
                "wineType"
            ).value,

        country:
            document.getElementById(
                "wineCountry"
            ).value,

        quantity:
            document.getElementById(
                "wineQuantity"
            ).value,

        location:
            document.getElementById(
                "wineLocation"
            ).value,

        notes:
            document.getElementById(
                "wineNotes"
            ).value

    };


    /*
       Midlertidig testlagring.
       OneDrive kommer senere.
    */

    localStorage.setItem(
        "testWine",
        JSON.stringify(wine)
    );


    alert(
        "Vinen er gemt midlertidigt."
    );


    resetWineForm();


    showHome();

}
