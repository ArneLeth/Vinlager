<script>


/* =====================================================
   GOOGLE DRIVE
===================================================== */

const GOOGLE_CLIENT_ID =
"701927788585-hfkv438gs0ljn6ln9c05q6p9lsns9j6i.apps.googleusercontent.com";


const GOOGLE_SCOPE =
"https://www.googleapis.com/auth/drive.file";


let googleTokenClient = null;

let googleAccessToken = null;

let googleFolderId =
    localStorage.getItem(
        "vinlagerGoogleFolderId"
    );


/* =====================================================
   VINLAGER DATA
===================================================== */

let winesCache = [];

let currentWineId = null;

let currentInventoryCategory = "";

let lookupWineData = null;


/* =====================================================
   SCANNER
===================================================== */

let scannerRunning = false;

let lastCode = "";

let detectionCount = 0;

const REQUIRED_DETECTIONS = 2;


/* =====================================================
   GOOGLE LOGIN
===================================================== */

function loginGoogle() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        alert(
            "Google-login er ikke indlæst endnu. " +
            "Prøv igen om et øjeblik."
        );

        return;

    }


    googleTokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id:
                GOOGLE_CLIENT_ID,

            scope:
                GOOGLE_SCOPE,

            callback:
                async function(response) {

                    if (response.error) {

                        console.error(
                            "Google login fejl:",
                            response
                        );

                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "❌ Google-login fejlede.";

                        return;

                    }


                    googleAccessToken =
                        response.access_token;


                    document.getElementById(
                        "googleStatus"
                    ).textContent =
                        "✅ Forbundet til Google Drive";


                    document.getElementById(
                        "googleLoginButton"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "googleLogoutButton"
                    ).style.display =
                        "block";


                    try {

                        await getOrCreateWineFolder();

                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "✅ Google Drive klar – Mit Vinlager";


                        await refreshWineCache();


                    }

                    catch (error) {

                        console.error(error);

                        document.getElementById(
                            "googleStatus"
                        ).textContent =
                            "⚠️ Google er logget ind, "
                            + "men Drive kunne ikke åbnes.";

                    }

                }

        });


    googleTokenClient.requestAccessToken({

        prompt: "consent"

    });

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutGoogle() {

    if (
        googleAccessToken &&
        window.google
    ) {

        google.accounts.oauth2.revoke(
            googleAccessToken
        );

    }


    googleAccessToken = null;

    googleFolderId = null;

    winesCache = [];


    localStorage.removeItem(
        "vinlagerGoogleFolderId"
    );


    document.getElementById(
        "googleStatus"
    ).textContent =
        "☁️ Ikke forbundet til Google Drive";


    document.getElementById(
        "googleLoginButton"
    ).style.display =
        "block";


    document.getElementById(
        "googleLogoutButton"
    ).style.display =
        "none";


    updateCategoryCounts();

}


/* =====================================================
   DRIVE REQUEST
===================================================== */

async function driveRequest(
    url,
    options = {}
) {

    if (!googleAccessToken) {

        throw new Error(
            "Ikke logget ind på Google Drive."
        );

    }


    const headers =
        options.headers || {};


    headers.Authorization =
        "Bearer "
        + googleAccessToken;


    options.headers =
        headers;


    const response =
        await fetch(
            url,
            options
        );


    if (!response.ok) {

        let errorText = "";

        try {

            const errorData =
                await response.json();

            errorText =
                errorData.error?.message
                ||
                JSON.stringify(
                    errorData
                );

        }

        catch {

            errorText =
                await response.text();

        }


        throw new Error(
            errorText
        );

    }


    return response;

}


/* =====================================================
   FIND / OPRET MAPPE
===================================================== */

async function getOrCreateWineFolder() {

    if (googleFolderId) {

        return googleFolderId;

    }


    const searchUrl =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            "name='Mit Vinlager'"
            + " and mimeType='application/vnd.google-apps.folder'"
            + " and trashed=false"
        )
        + "&spaces=drive"
        + "&fields=files(id,name)";


    const response =
        await driveRequest(
            searchUrl
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length > 0
    ) {

        googleFolderId =
            data.files[0].id;


        localStorage.setItem(
            "vinlagerGoogleFolderId",
            googleFolderId
        );


        return googleFolderId;

    }


    const createResponse =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            "Mit Vinlager",

                        mimeType:
                            "application/vnd.google-apps.folder"

                    })

            }
        );


    const folder =
        await createResponse.json();


    googleFolderId =
        folder.id;


    localStorage.setItem(
        "vinlagerGoogleFolderId",
        googleFolderId
    );


    return googleFolderId;

}


/* =====================================================
   FIND FIL
===================================================== */

async function findDriveFile(
    fileName
) {

    const query =
        "name='"
        + fileName.replace(
            /'/g,
            "\\'"
        )
        + "'"
        + " and '"
        + googleFolderId
        + "' in parents"
        + " and trashed=false";


    const url =
        "https://www.googleapis.com/drive/v3/files"
        + "?q="
        + encodeURIComponent(
            query
        )
        + "&spaces=drive"
        + "&fields=files(id,name,mimeType)";


    const response =
        await driveRequest(
            url
        );


    const data =
        await response.json();


    if (
        data.files &&
        data.files.length
    ) {

        return data.files[0];

    }


    return null;

}


/* =====================================================
   HENT WINES.JSON
===================================================== */

async function loadWinesFromDrive() {

    const file =
        await findDriveFile(
            "wines.json"
        );


    if (!file) {

        return [];

    }


    const response =
        await driveRequest(
            "https://www.googleapis.com/drive/v3/files/"
            + file.id
            + "?alt=media"
        );


    const text =
        await response.text();


    try {

        const wines =
            JSON.parse(text);


        return Array.isArray(wines)
            ? wines
            : [];

    }

    catch {

        return [];

    }

}


/* =====================================================
   OPDATER LOKAL CACHE
===================================================== */

async function refreshWineCache() {

    if (!googleAccessToken) {

        winesCache = [];

        updateCategoryCounts();

        return [];

    }


    try {

        winesCache =
            await loadWinesFromDrive();


        if (!Array.isArray(winesCache)) {

            winesCache = [];

        }


        updateCategoryCounts();


        return winesCache;

    }

    catch (error) {

        console.error(
            "Kunne ikke hente vinlager:",
            error
        );

        return winesCache;

    }

}

===================================================== */

async function saveWinesToDrive(
    wines
) {

    const json =
        JSON.stringify(
            wines,
            null,
            2
        );


    const existingFile =
        await findDriveFile(
            "wines.json"
        );


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--"
        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const metadata = {

        name:
            "wines.json",

        mimeType:
            "application/json"

    };


    if (!existingFile) {

        metadata.parents =
            [googleFolderId];

    }


    const body =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(metadata)
        + delimiter
        + "Content-Type: application/json\r\n\r\n"
        + json
        + closeDelimiter;


    let url;

    let method;


    if (existingFile) {

        url =
            "https://www.googleapis.com/upload/drive/v3/files/"
            + existingFile.id
            + "?uploadType=multipart";

        method =
            "PATCH";

    }

    else {

        url =
            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart";

        method =
            "POST";

    }


    await driveRequest(
        url,
        {

            method:
                method,

            headers: {

                "Content-Type":
                    "multipart/related; boundary="
                    + boundary

            },

            body:
                body

        }
    );

}


/* =====================================================
   BILLEDEKOMPRIMERING
===================================================== */

function compressImage(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const image =
                        new Image();


                    image.onload =
                        function() {

                            const MAX_WIDTH =
                                1200;


                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width >
                                MAX_WIDTH
                            ) {

                                height =
                                    height
                                    *
                                    MAX_WIDTH
                                    /
                                    width;

                                width =
                                    MAX_WIDTH;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(

                                function(blob) {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                "Kunne ikke komprimere billedet."
                                            )
                                        );

                                        return;

                                    }


                                    resolve(blob);

                                },

                                "image/jpeg",

                                0.78

                            );

                        };


                    image.onerror =
                        reject;


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   UPLOAD FOTO
===================================================== */

async function uploadWinePhoto(
    file,
    wineId
) {

    if (!file) {

        return null;

    }


    const compressed =
        await compressImage(
            file
        );


    const fileName =
        "vin_"
        + wineId
        + ".jpg";


    const metadata = {

        name:
            fileName,

        mimeType:
            "image/jpeg",

        parents:
            [googleFolderId]

    };


    const boundary =
        "-------314159265358979323846";


    const delimiter =
        "\r\n--"
        + boundary
        + "\r\n";


    const closeDelimiter =
        "\r\n--"
        + boundary
        + "--";


    const metadataPart =
        delimiter
        + "Content-Type: application/json; charset=UTF-8\r\n\r\n"
        + JSON.stringify(metadata);


    const imagePart =
        delimiter
        + "Content-Type: image/jpeg\r\n\r\n";


    const body =
        new Blob(
            [

                metadataPart,

                imagePart,

                compressed,

                closeDelimiter

            ],

            {

                type:
                    "multipart/related; boundary="
                    + boundary

            }
        );


    const response =
        await driveRequest(

            "https://www.googleapis.com/upload/drive/v3/files"
            + "?uploadType=multipart",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "multipart/related; boundary="
                        + boundary

                },

                body:
                    body

            }

        );


    const data =
        await response.json();


    return data.id;

}

/* =====================================================
   STREGKODE FUNDET
===================================================== */

function barcodeDetected(result) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {

        return;

    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {

        return;

    }


    if (
        code === lastCode
    ) {

        detectionCount++;

    }

    else {

        lastCode =
            code;

        detectionCount =
            1;

    }


    document.getElementById(
        "scannerStatus"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        finishScan(
            code
        );

    }

}

/* =====================================================

===================================================== */

async function lookupWine(code) {

    const status =
        document.getElementById(
            "lookupStatus"
        );


    status.className =
        "lookupStatus";


    status.textContent =
        "🔎 Søger efter vin...";


    const fields = [

        "code",

        "product_name",

        "product_name_da",

        "generic_name",

        "generic_name_da",

        "brands",

        "categories",

        "categories_tags",

        "countries",

        "countries_tags",

        "origins"

    ].join(",");


    const url =
        "https://world.openfoodfacts.org/api/v3/product/"
        + encodeURIComponent(code)
        + "?product_type=all"
        + "&lc=da"
        + "&cc=dk"
        + "&fields="
        + encodeURIComponent(fields);


    try {

        const response =
            await fetch(
                url,
                {
                    method:
                        "GET"
                }
            );


        if (!response.ok) {

            if (
                response.status === 404
            ) {

                lookupWineData =
                    null;


                status.className =
                    "lookupStatus lookupWarning";


                status.textContent =
                    "⚠️ Stregkoden findes ikke "
                    + "i databasen. Du kan indtaste "
                    + "vinen manuelt.";

                return;

            }


            throw new Error(
                "HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        const product =
            data.product;


        if (!product) {

            lookupWineData =
                null;


            status.className =
                "lookupStatus lookupWarning";


            status.textContent =
                "⚠️ Vinen blev ikke fundet "
                + "i databasen.";

            return;

        }


        const name =

            product.product_name_da
            ||
            product.product_name
            ||
            product.generic_name_da
            ||
            product.generic_name
            ||
            "";


        const producer =
            product.brands
            ||
            "";


        const country =
            extractCountry(
                product
            );


        const type =
            detectWineType(
                product
            );


        lookupWineData = {

            name:
                name,

            producer:
                producer,

            country:
                country,

            type:
                type

        };


        status.className =
            "lookupStatus lookupSuccess";


        if (name) {

            status.textContent =
                "✅ Vin fundet: "
                + name
                + ". Kontrollér oplysningerne "
                + "før du gemmer.";

        }

        else {

            status.textContent =
                "✅ Stregkoden blev fundet, "
                + "men der mangler vinoplysninger. "
                + "Kontrollér formularen.";

        }

    }

    catch (error) {

        console.error(
            "Vinopslag fejlede:",
            error
        );


        lookupWineData =
            null;


        status.className =
            "lookupStatus lookupError";


        status.textContent =
            "⚠️ Kunne ikke kontakte "
            + "vin-databasen. "
            + "Du kan stadig indtaste "
            + "vinen manuelt.";

    }

}


/* =====================================================
   FIND LAND
===================================================== */

function extractCountry(product) {

    if (
        Array.isArray(
            product.countries_tags
        )
        &&
        product.countries_tags.length
    ) {

        return cleanTaxonomyValue(
            product.countries_tags[0]
        );

    }


    if (product.countries) {

        return product.countries
            .split(",")[0]
            .trim();

    }


    if (product.origins) {

        return product.origins
            .split(",")[0]
            .trim();

    }


    return "";

}


/* =====================================================
   RENS TAXONOMI
===================================================== */

function cleanTaxonomyValue(value) {

    if (!value) {

        return "";

    }


    const parts =
        value.split(":");


    if (parts.length > 1) {

        return parts
            .slice(1)
            .join(":")
            .replace(
                /-/g,
                " "
            );

    }


    return value.replace(
        /-/g,
        " "
    );

}


/* =====================================================
   GENKENDEL VINTYPE
===================================================== */

function detectWineType(product) {

    const text = (

        (
            product.product_name
            ||
            ""
        )

        + " "

        +

        (
            product.product_name_da
            ||
            ""
        )

        + " "

        +

        (
            product.generic_name
            ||
            ""
        )

        + " "

        +

        (
            product.categories
            ||
            ""
        )

        + " "

        +

        (
            Array.isArray(
                product.categories_tags
            )
            ?
            product.categories_tags.join(" ")
            :
            ""
        )

    ).toLowerCase();


    if (
        text.includes("champagne")
    ) {

        return "Champagne";

    }


    if (
        text.includes("port wine")
        ||
        text.includes("portwine")
        ||
        text.includes("portvin")
        ||
        text.includes("porto")
    ) {

        return "Portvin";

    }


    if (
        text.includes("sparkling")
        ||
        text.includes("mousser")
        ||
        text.includes("prosecco")
        ||
        text.includes("cava")
        ||
        text.includes("crémant")
        ||
        text.includes("cremant")
        ||
        text.includes("sekt")
    ) {

        return "Mousserende";

    }


    if (
        text.includes("rosé")
        ||
        text.includes("rose wine")
        ||
        text.includes("rosévin")
        ||
        text.includes("vino rosato")
        ||
        text.includes("vin rosé")
        ||
        text.includes("rose")
    ) {

        return "Rosé";

    }


    if (
        text.includes("spirit")
        ||
        text.includes("whisky")
        ||
        text.includes("whiskey")
        ||
        text.includes("vodka")
        ||
        text.includes("gin")
        ||
        text.includes("rum")
        ||
        text.includes("brandy")
        ||
        text.includes("cognac")
        ||
        text.includes("liqueur")
        ||
        text.includes("likør")
    ) {

        return "Spiritus";

    }


    if (
        text.includes("white wine")
        ||
        text.includes("white-wine")
        ||
        text.includes("hvidvin")
        ||
        text.includes("vino bianco")
        ||
        text.includes("vin blanc")
        ||
        text.includes("weisswein")
        ||
        text.includes("weißwein")
    ) {

        return "Hvidvin";

    }


    if (
        text.includes("red wine")
        ||
        text.includes("red-wine")
        ||
        text.includes("rødvin")
        ||
        text.includes("vino rosso")
        ||
        text.includes("vin rouge")
        ||
        text.includes("rotwein")
    ) {

        return "Rødvin";

    }


    return "Rødvin";

}

function updateCategoryCounts() {

    const categories = [

        "Rødvin",

        "Hvidvin",

        "Rosé",

        "Mousserende",

        "Champagne",

        "Portvin",

        "Spiritus"

    ];


    categories.forEach(
        function(category) {

            const element =
                document.getElementById(
                    "count"
                    + category
                );


            if (!element) {

                return;

            }


            const total =
                winesCache

                    .filter(
                        wine =>
                            wine.type ===
                            category
                    )

                    .reduce(
                        function(sum, wine) {

                            return sum
                                +
                                (
                                    parseInt(
                                        wine.quantity
                                    )
                                    ||
                                    0
                                );

                        },
                        0
                    );


            element.textContent =
                total;

        }
    );

}

                ⚠️ Kunne ikke hente vinlageret.
            </div>
            `;

    }

}


/* =====================================================
   VIS VINLAGER
===================================================== */

function renderInventory() {

    const list =
        document.getElementById(
            "inventoryList"
        );


    const summary =
        document.getElementById(
            "inventorySummary"
        );


    const search =
        document.getElementById(
            "inventorySearch"
        ).value
        .trim()
        .toLowerCase();


    let wines =
        [...winesCache];


    if (currentInventoryCategory) {

        wines =
            wines.filter(
                wine =>
                    wine.type ===
                    currentInventoryCategory
            );

    }


    if (search) {

        wines =
            wines.filter(
                function(wine) {

                    const text = (

                        wine.name
                        || ""

                        + " "

                        + (
                            wine.producer
                            || ""
                        )

                        + " "

                        + (
                            wine.country
                            || ""
                        )

                        + " "

                        + (
                            wine.barcode
                            || ""
                        )

                        + " "

                        + (
                            wine.location
                            || ""
                        )

                    ).toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    wines.sort(
        function(a, b) {

            return (
                a.name || ""
            ).localeCompare(
                b.name || "",
                "da"
            );

        }
    );


    const totalBottles =
        wines.reduce(
            function(sum, wine) {

                return sum
                    +
                    (
                        parseInt(
                            wine.quantity
                        )
                        ||
                        0
                    );

            },
            0
        );


    summary.textContent =
        wines.length
        + " forskellige vine · "
        + totalBottles
        + " flasker";


    if (!wines.length) {

        list.innerHTML =
            `
            <div class="empty">
                🍷 Ingen vine fundet.
            </div>
            `;

        return;

    }


    list.innerHTML =
        wines
            .map(
                function(wine) {

                    const quantity =
                        parseInt(
                            wine.quantity
                        )
                        ||
                        0;


                    const meta = [

                        wine.producer,

                        wine.year,

                        wine.location

                    ]

                        .filter(
                            value =>
                                value
                        )

                        .join(
                            " · "
                        );


                    return `

                    <div
                        class="inventory-item">

                        <div
                            class="inventory-info">

                            <div
                                class="inventory-name">

                                ${
                                    escapeHtml(
                                        wine.name
                                        ||
                                        "Ukendt vin"
                                    )
                                }

                            </div>

                            <div
                                class="inventory-meta">

                                ${
                                    escapeHtml(
                                        meta
                                        ||
                                        wine.type
                                        ||
                                        ""
                                    )
                                }

                            </div>

                        </div>


                        <div
                            class="inventory-quantity">

                            ${quantity}

                        </div>


                        <button
                            class="view-button"
                            onclick="showWineDetails('${escapeJs(wine.id)}')">

                            Vis

                        </button>

                    </div>

                    `;

                }
            )
            .join("");

}

/* =====================================================
   GEM ÆNDRINGER
===================================================== */

async function saveWineChanges() {

    if (!currentWineId) {

        return;

    }


    const wine =
        winesCache.find(
            item =>
                item.id ===
                currentWineId
        );


    if (!wine) {

        return;

    }


    const quantity =
        parseInt(
            document.getElementById(
                "editQuantity"
            ).value
        );


    wine.year =
        document.getElementById(
            "editYear"
        ).value;


    wine.quantity =
        isNaN(quantity)
            ? 0
            : quantity;


    wine.location =
        document.getElementById(
            "editLocation"
        ).value.trim();


    wine.notes =
        document.getElementById(
            "editNotes"
        ).value.trim();


    try {

        const button =
            document.querySelector(
                "#wineDetailsPage .save"
            );


        button.disabled =
            true;


        button.textContent =
            "☁️ Gemmer…";


        await saveWinesToDrive(
            winesCache
        );


        updateCategoryCounts();


        button.disabled =
            false;


        button.textContent =
            "💾 Gem ændringer";


        alert(
            "✅ Ændringerne er gemt."
        );


        openInventory();

    }

    catch (error) {

        console.error(error);


        const button =
            document.querySelector(
                "#wineDetailsPage .save"
            );


        button.disabled =
            false;


        button.textContent =
            "💾 Gem ændringer";


        alert(
            "⚠️ Kunne ikke gemme ændringerne.\n\n"
            + error.message
        );

    }

}


/* =====================================================
   HJÆLPEFUNKTION - ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   HJÆLPEFUNKTION - ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(value) {

    return String(
        value ?? ""
    )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        );

}
