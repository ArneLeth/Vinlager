<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<title>Vinlager – Scanner test</title>

<script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
    font-size: 24px;
}

.info {
    text-align: center;
    color: #ccc;
    margin-bottom: 15px;
}

/* Kamera */

#camera {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 16px;
    background: black;
}

/* Sørger for at video fylder området */

#camera video {
    width: 100%;
    height: auto;
    display: block;
}

/* Quagga overlay */

#camera canvas.drawingBuffer {
    position: absolute;
    top: 0;
    left: 0;
}

/* Scanområde */

.scanbox {
    position: absolute;
    top: 35%;
    left: 5%;
    width: 90%;
    height: 30%;

    border: 3px solid white;
    border-radius: 8px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.20);
}

.scanline {
    position: absolute;
    top: 50%;
    left: 5%;
    width: 90%;
    height: 2px;
    background: red;
}

/* Resultat */

#result {
    display: none;
    text-align: center;
    margin-top: 20px;
    padding: 20px;
    background: white;
    color: #222;
    border-radius: 16px;
}

.barcode {
    font-size: 25px;
    font-weight: bold;
    margin: 12px;
    letter-spacing: 1px;
}

/* Knapper */

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 17px;
    margin-top: 12px;

    font-size: 18px;
    font-weight: 600;
}

.start {
    background: white;
    color: #111;
}

.stop {
    background: #444;
    color: white;
}

#status {
    text-align: center;
    margin: 15px 0;
    color: #ccc;
}

</style>
</head>


<body>

<div class="container">

<h1>📷 Stregkode-test</h1>

<div class="info">
    Placer EAN-stregkoden inden for rammen
</div>

<div id="camera">

    <div class="scanbox"></div>
    <div class="scanline"></div>

</div>

<div id="status">
    Tryk på Start scanner
</div>

<div id="result">

    <div>Stregkode fundet:</div>

    <div
        id="barcode"
        class="barcode">
    </div>

    <div>
        EAN-13
    </div>

</div>

<button
    class="start"
    onclick="startScanner()">

    📷 Start scanner

</button>

<button
    class="stop"
    onclick="stopScanner()">

    ← Luk scanner

</button>

</div>


<script>

let scannerRunning = false;

let lastCode = "";

let detectionCount = 0;

const REQUIRED_DETECTIONS = 2;


/* =========================
   START SCANNER
========================= */

function startScanner() {

    if (scannerRunning) {
        return;
    }

    document.getElementById("result").style.display =
        "none";

    document.getElementById("status").textContent =
        "Starter kamera…";


    const config = {

        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.querySelector("#camera"),

            constraints: {

                width: {
                    min: 640,
                    ideal: 1920
                },

                height: {
                    min: 480,
                    ideal: 1080
                },

                facingMode: {
                    ideal: "environment"
                },

                aspectRatio: {
                    ideal: 16 / 9
                },

                focusMode: "continuous"

            },

            area: {

                top: "25%",
                right: "5%",
                left: "5%",
                bottom: "25%"

            }

        },


        locator: {

            /*
             * Medium giver god balance
             * mellem hastighed og præcision.
             */

            patchSize: "medium",

            /*
             * Halverer billedet under
             * lokaliseringen og gør
             * scanningen hurtigere.
             */

            halfSample: true

        },


        frequency: 15,


        decoder: {

            readers: [

                "ean_reader",
                "ean_8_reader"

            ]

        },


        locate: true,


        numOfWorkers:
            navigator.hardwareConcurrency
            ? Math.min(
                navigator.hardwareConcurrency,
                4
              )
            : 2

    };


    Quagga.init(
        config,

        function(error) {

            if (error) {

                console.error(error);

                document.getElementById(
                    "status"
                ).textContent =
                    "Kameraet kunne ikke startes.";

                return;

            }


            Quagga.start();

            scannerRunning = true;


            document.getElementById(
                "status"
            ).textContent =
                "Scanner…";


            Quagga.onDetected(
                barcodeDetected
            );

        }

    );

}


/* =========================
   STREGKODE FUNDET
========================= */

function barcodeDetected(result) {

    if (
        !result ||
        !result.codeResult ||
        !result.codeResult.code
    ) {
        return;
    }


    const code =
        result.codeResult.code;


    const format =
        result.codeResult.format;


    /*
     * Vi accepterer kun EAN.
     */

    if (
        format !== "ean_13" &&
        format !== "ean_8"
    ) {
        return;
    }


    /*
     * Kræv samme kode flere gange.
     * Det reducerer risikoen for
     * fejlaflæsning.
     */

    if (code === lastCode) {

        detectionCount++;

    } else {

        lastCode = code;

        detectionCount = 1;

    }


    document.getElementById(
        "status"
    ).textContent =
        "EAN fundet – bekræfter…";


    if (
        detectionCount >=
        REQUIRED_DETECTIONS
    ) {

        showResult(code);

    }

}


/* =========================
   VIS RESULTAT
========================= */

function showResult(code) {

    stopScanner();


    document.getElementById(
        "barcode"
    ).textContent = code;


    document.getElementById(
        "result"
    ).style.display = "block";


    document.getElementById(
        "status"
    ).textContent =
        "Stregkode fundet!";

}


/* =========================
   STOP
========================= */

function stopScanner() {

    if (!scannerRunning) {
        return;
    }


    try {

        Quagga.stop();

    } catch (e) {

        console.log(e);

    }


    scannerRunning = false;

}

</script>

</body>
</html>
